<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Card Game - STB Compatible</title>
    
    <!-- External Dependencies: Font Awesome & Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        /* CSS & Layout */
        :root {
          font-size: 14px;
        }
        @media (max-width: 400px) {
          :root {
            font-size: 12px;
          }
        }

        * {
          box-sizing: border-box;
        }

        body {
          font-family: Arial, sans-serif;
          background-image: url("//ahmedkorim.github.io/udamemoerygame/img/geometry2.png"), linear-gradient(45deg, rgba(46, 61, 73, 0.6), rgba(46, 61, 73, 0.5));
          background-blend-mode: overlay;
          height: 100vh;
          margin: 0;
        }

        main {
          display: none;
        }

        .container {
          margin: auto;
          padding: 0 15px;
        }
        @media (min-width: 320px) {
          .container {
            width: 100%;
          }
        }
        @media (min-width: 720px) {
          .container {
            width: 720px;
          }
        }
        @media (min-width: 920px) {
          .container {
            width: 920px;
          }
        }
        @media (min-width: 1200px) {
          .container {
            width: 1200px;
          }
        }

        .row {
          display: flex;
          margin: 0 -15px;
          align-items: center;
          align-content: center;
        }

        .AK-btn {
          position: relative;
          width: 50%;
          margin: auto;
        }
        .AK-btn button, .AK-btn input {
          box-shadow: -2px 7px 20px 2px rgba(46, 61, 73, 0.35);
          border-radius: 20px;
          color: #FFFFFF;
          outline: none;
          border: none;
          display: block;
          font-size: 1.5rem;
          padding: 0.5rem 0.25rem;
          width: 100%;
          transition: all 0.6s ease-in-out;
          background-color: #2e3d49;
        }
        .AK-btn button[type=text], .AK-btn input[type=text] {
          text-align: center;
        }
        .AK-btn button, .AK-btn input[type=submit] {
          cursor: pointer;
        }
        .AK-btn button:hover, .AK-btn button:focus, .AK-btn button:active, 
        .AK-btn input[type=submit]:hover, .AK-btn input[type=submit]:focus, .AK-btn input[type=submit]:active {
          box-shadow: -2px 7px 20px 2px rgba(255, 255, 255, 0.05);
          background-color: #e3e3e3;
          color: #2e3d49;
        }

        .stars {
          padding: 0;
          margin-right: auto;
          display: block;
          list-style: none;
          flex-wrap: nowrap;
        }
        .stars li {
          color: gold;
          display: inline-block;
        }

        .text-center {
          text-align: center;
        }

        .img-resposive {
          max-width: 90%;
          pointer-events: none; /* Mencegah gambar mengganggu event click */
        }

        header .col {
          width: 100%;
        }
        header h1 {
          text-align: center;
          color: #fff;
        }

        .score-panel .wraper, #result .modal-body, #gamestarting .wraper {
          justify-content: center;
          align-items: center;
          margin: auto;
          display: flex;
          width: 100%;
        }
        @media (min-width: 520px) {
          .score-panel .wraper, #result .modal-body, #gamestarting .wraper {
            width: 80%;
          }
        }
        @media (min-width: 680px) {
          .score-panel .wraper, #result .modal-body, #gamestarting .wraper {
            width: 70%;
          }
        }
        @media (min-width: 950px) {
          .score-panel .wraper, #result .modal-body, #gamestarting .wraper {
            width: 60%;
          }
        }
        @media (min-width: 1200px) {
          .score-panel .wraper, #result .modal-body, #gamestarting .wraper {
            width: 50%;
          }
        }

        .score-panel .col {
          padding: 1%;
          display: flex;
          justify-content: center;
          align-items: center;
          color: #fff;
        }
        @media (max-width: 400px) {
          .score-panel .col {
            font-size: 0.7rem;
          }
        }
        .score-panel .col:first-of-type, .score-panel .col:nth-of-type(2) {
          width: 50%;
        }
        .score-panel .restart {
          overflow: hidden;
          margin-left: 3rem;
          cursor: pointer;
          padding: 5px 10px;
          border-radius: 8px;
        }
        .score-panel .moves {
          margin: auto;
        }

        .card-home {
          padding-bottom: 50px;
        }
        .card-home .col {
          width: 50%;
        }
        .card-home .deck, #gamestarting .wraper, #result .modal-content {
          background: linear-gradient(160deg, #02ccba 0%, #aa7ecd 100%);
          border-radius: 10px;
          box-shadow: 12px 15px 20px 0 rgba(46, 61, 73, 0.5);
          padding: 2%;
          width: 100%;
          margin: auto;
        }
        @media (min-width: 520px) {
          .card-home .deck, #gamestarting .wraper, #result .modal-content { width: 80%; }
        }
        @media (min-width: 680px) {
          .card-home .deck, #gamestarting .wraper, #result .modal-content { width: 70%; }
        }
        @media (min-width: 950px) {
          .card-home .deck, #gamestarting .wraper, #result .modal-content { width: 60%; }
        }
        @media (min-width: 1200px) {
          .card-home .deck, #gamestarting .wraper, #result .modal-content { width: 50%; }
        }

        .card-home .deck {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          align-items: center;
          list-style: none;
        }
        .card-home .deck li.card, #gamestarting .callToAction .chose .chose-item {
          background: #2e3d49;
          color: #2e3d49;
          border-radius: 8px;
          cursor: pointer;
          box-shadow: 5px 2px 20px 0 rgba(46, 61, 73, 0.5);
        }
        .card-home .deck li.card {
          font-size: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 2%;
          width: 20%;
          margin: 1.66667%;
        }
        .card-home .deck li.card .img-resposive {
          visibility: hidden;
        }
        .card-home .deck li.card.open {
          transform: rotateY(0);
          background: #ffffff;
          cursor: default;
        }
        .card-home .deck li.card.show {
          font-size: 33px;
        }
        .card-home .deck li.card.show .img-resposive {
          visibility: visible;
        }
        .card-home .deck li.card.match {
          cursor: default;
          background: #02ccba;
          font-size: 33px;
        }
        .card-home .deck li.card.wrong {
          background: #e5534d;
        }

        #gamestarting {
          text-align: center;
        }
        #gamestarting .row {
          justify-content: center;
          align-items: center;
        }
        #gamestarting p {
          text-align: center;
          font-size: 1.4rem;
        }
        #gamestarting .col {
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }
        #gamestarting .wraper {
          position: relative;
          padding: 2rem 1rem;
          flex-direction: column;
        }
        #gamestarting .loading {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 12px;
          top: 0;
          left: 0;
          background-color: #fff;
          overflow: hidden;
          z-index: -1;
        }
        #gamestarting .loading img {
          display: block;
          width: 100%;
        }
        #gamestarting .callToAction {
          margin: auto;
          width: 100%;
        }
        @media (min-width: 450px) {
          #gamestarting .callToAction {
            width: 70%;
          }
        }
        #gamestarting .callToAction .chose {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          align-items: center;
          width: 90%;
          margin: auto;
        }
        #gamestarting .callToAction .chose .chose-item {
          position: relative;
          width: 40%;
          margin: 5%;
          padding: 5%;
          display: block;
        }
        #gamestarting .callToAction .chose .chose-item.active .chose-icon {
          opacity: 1;
        }
        #gamestarting .callToAction .chose .chose-item .chose-icon {
          transition: all 0.3s ease-in-out;
          position: absolute;
          top: 0.1rem;
          left: 0.3rem;
          font-size: 1.5rem;
          opacity: 0;
          color: #1aee1a;
        }

        #result {
          overflow: hidden;
          background-color: rgba(0, 0, 0, 0.7);
          height: 100vh;
          width: 100%;
          position: fixed;
          top: 0;
          left: 0;
          display: none;
        }
        #result.active {
          display: block;
        }
        #result .col {
          width: 100%;
        }
        #result .modal {
          transition: all 1s ease-in-out;
          transform: translate(2000px);
          height: 100vh;
          display: flex;
          align-items: center;
        }
        #result p {
          font-size: 1.5rem;
        }
        #result ul {
          font-size: 1.8rem;
        }
        #result .modal-content {
          padding-top: 10%;
          padding-bottom: 10%;
          width: 100%;
        }

        /* STB Focus Outline Styling */
        .stb-focused {
          outline: 5px solid #FFD700 !important;
          outline-offset: 3px !important;
          box-shadow: 0 0 20px #FFD700 !important;
        }
    </style>
</head>
<body>

    <!-- Main Game Section -->
    <main>
        <header>
            <div class="container">
                <div class="row">
                    <div class="col">
                        <h1 id="player-name"></h1>
                    </div>
                </div>
            </div>
        </header>
        <section class="score-panel">
            <div class="container">
                <div class="row">
                    <div class="wraper">
                        <div class="col">
                            <ul class="stars">
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                            </ul>
                            <div class="timer">
                                <span>00 : 00 : 00</span>
                            </div>
                        </div>
                        <div class="col">
                            <div class="restart" tabindex="0">
                                <i class="fa fa-rotate-right"></i>
                            </div>
                            <div class="moves"> Moves : 0</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <section class="card-home">
            <div class="container game-body">
                <div class="row game-wraper">
                    <ul class="deck">
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <!-- Game Starter Screen -->
    <section id="gamestarting">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="wraper">
                        <div class="loading">
                            <img src="//ahmedkorim.github.io/udamemoerygame/img/loading.gif" alt="loading">
                        </div>
                        <h1>Welcome to Matching Card Game</h1>
                        <p>Enter your name, choose game type and click start to play</p>
                        <div class="callToAction" id="newplayer">
                            <div class="AK-btn">
                                <input type="text" id="palyername" value="skip" placeholder="Enter your name" tabindex="0">
                            </div>
                            <p>Now choose game cards you like</p>
                            <div class="chose">
                                <div class="chose-item active" data-type="pakemonGo" title="pakemonGo cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/pakemonGo/pikachu-2.svg" alt="pokemon">
                                </div>
                                <div class="chose-item" data-type="eduction" title="eduction cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/eduction/eraser.svg" alt="education">
                                </div>
                                <div class="chose-item" data-type="socialicons" title="socialicons cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/socialicons/008-twitter.svg" alt="twitter">
                                </div>
                                <div class="chose-item" data-type="icons" title="icons cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/socialicons/012-spotify.svg" alt="spotify">
                                </div>
                            </div>
                            <div class="AK-btn">
                                <input type="submit" value="start" class="AK-btn" id="startTheGame" tabindex="0">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Game Result Modal Screen -->
    <section id="result">
        <div class="modal">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="modal-body">
                            <div class="modal-content text-center">
                                <p>Congratulations <span id="playername"></span>, you made it!</p>
                                <ul class="stars">
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                </ul>
                                <div class="AK-btn"><button id="play-again" tabindex="0">Play Again</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript Engine -->
    <script>
        let lock = 0, star;

        const featch = (function () {
            async function getData() {
                const data = await fetch("https://ahmedkorim.github.io/udamemoerygame/remotedata.json");
                const list = await data.json();
                return list;
            }
            return { getData };
        })();

        const cardsCreartor = (function () {
            function getCareds(cards) {
                let number = cards.length,
                    randomCards = [],
                    indexes = [],
                    rand;
                for (let i = 0; i < number; i++) {
                    rand = Math.floor(Math.random() * number);
                    if (!indexes.includes(rand) && randomCards.length <= cards.length) {
                        indexes.push(rand);
                        randomCards[i] = cards[rand];
                    } else {
                        i--;
                    }
                }
                return randomCards;
            }

            function eventLoeder(deck) {
                deck.addEventListener("click", function (e) {
                    game.runer(e);
                });
            }

            return {
                getCards: getCareds,
                eventLoeder
            };
        })();

        function creatProfile(playerName, gameType, cards) {
            const data = (function (playerName, gameType, cards) {
                class gameState {
                    constructor() {
                        this.playerName = playerName;
                        this.moves = 0;
                        this.level = 0;
                        this.gameType = gameType;
                        this.time = {seconds: 0, minutes: 0, hours: 0};
                        this.interval = null;
                        this.deck = ui.gttingDeck();
                        this.gameData = null;
                        this.intialHtml = null;
                        this.initialRate = document.querySelector('.stars').innerHTML;
                        this.curentRate = document.querySelector(".stars").children.length;
                        this.matched = 0;
                    }

                    addMatched() {
                        this.matched += 1;
                    }

                    levelUp() {
                        this.level += 1;
                    }

                    addMove() {
                        this.moves += 1;
                        ui.moverUpdate();
                    }

                    timer() {
                        const time = this.time;
                        this.interval = setInterval(function () {
                            if (time.seconds < 59) {
                                time.seconds++;
                            } else if (time.seconds === 59) {
                                time.seconds = 0;
                                if (time.minutes <= 59) {
                                    time.minutes++;
                                } else {
                                    time.minutes = 0;
                                    time.hours++;
                                }
                            }
                            ui.timerUpdate(time);
                        }, 1000);
                    }

                    gameHtml() {
                        this.gameData = this.deck.innerHTML;
                    }

                    sethtml(cardsData) {
                        this.gameData = cardsData;
                        let cardsArr = cardsData[this.gameType];
                        cardsArr = cardsCreartor.getCards(cardsArr);
                        
                        // Buat elemen parser untuk menambahkan tabindex pada string HTML kartu
                        let tempDiv = document.createElement('div');
                        let placeHodlder = "";
                        cardsArr.forEach(function (i) {
                            placeHodlder += i;
                        });
                        tempDiv.innerHTML = placeHodlder;
                        
                        // Memastikan setiap elemen kartu memiliki atribut tabindex="0"
                        tempDiv.querySelectorAll('li').forEach(li => {
                            li.setAttribute('tabindex', '0');
                        });
                        
                        this.intialHtml = tempDiv.innerHTML;
                    }

                    rating() {
                        if (this.moves / 9 > 1 && this.curentRate > 1) {
                            this.curentRate--;
                            ui.rate(this.curentRate);
                        }
                    }

                    plusTry() {
                        if (this.moves / 9 > 1 && this.curentRate <= 8) {
                            this.curentRate++;
                            star = document.createElement("li");
                            star.innerHTML = '<i class="fa fa-star"></i>';
                            document.querySelector("ul.stars").appendChild(star);
                        }
                    }
                }

                return { gameState };
            })(playerName, gameType, cards);

            return { data, current: null };
        }

        const ui = (function () {
            function updateRate() {
                let data = document.querySelector('.stars').innerHTML;
                if(window.current) window.current.initialRate = data;
                document.querySelector('#result .stars').innerHTML = data;
            }

            document.querySelector('.restart').addEventListener('click', function () {
                ui.playAgain();
            });

            function hideNow() {
                document.querySelector('.modal').style.transform = "translate(2000px)";
                setTimeout(function () {
                    document.querySelector('#result').className = "";
                }, 600);
            }

            function showNow() {
                document.querySelector('#play-again').addEventListener('click', function () {
                    ui.hideNow();
                    ui.playAgain();
                });

                document.querySelector('#result').className = "active";
                document.querySelector('.modal').style.transform = "translate(0px)";
                setTimeout(() => {
                    activeFocusIndex = 0;
                    updateFocus(getFocusableElements());
                }, 700);
            }

            function gameOver(state) {
                ui.showNow();
            }

            function playAgain() {
                document.querySelector(".stars").innerHTML = window.current.initialRate;
                clearInterval(window.current.interval);
                lock = 0;
                window.current.moves = 0;
                ui.moverUpdate();
                window.current.level = 0;
                window.current.time = {seconds: 0, minutes: 0, hours: 0};
                ui.timerUpdate(window.current.time);
                window.current.interval = void 0;
                game.currentClicked = [];
                window.current.matched = 0;
                window.current.sethtml(window.current.gameData);
                ui.drow(window.current.intialHtml);
            }

            function rate(starIndex) {
                document.querySelector(".stars").children[starIndex]?.remove();
            }

            function gttingDeck() {
                return document.querySelector(".deck");
            }

            function drow(html) {
                let deck = gttingDeck();
                deck.innerHTML = "";
                deck.innerHTML = html;
                document.querySelector("#player-name").innerHTML = `${window.current.gameType} Matching`;
                
                const cardEl = document.querySelector('.card');
                if (cardEl) {
                    const height = parseInt(getComputedStyle(cardEl).width.slice(0, -2));
                    deck.querySelectorAll('.card').forEach(function (i) {
                        i.setAttribute('tabindex', '0');
                        i.style.height = height + "px";
                    });
                }
                
                cardsCreartor.eventLoeder(deck);
                
                // Set fokus remote ke elemen kartu pertama
                setTimeout(() => {
                    activeFocusIndex = 0;
                    updateFocus(getFocusableElements());
                }, 100);
            }

            function moverUpdate() {
                document.querySelector(".moves").innerHTML = `Moves : ${window.current.moves}`;
            }

            function timerUpdate(time) {
                const timer = document.querySelector('.timer span');
                let time0 = {};

                for (let i in time) {
                    time0[i] = time[i] < 10 ? "0" + time[i] : time[i];
                }

                timer.innerHTML = `${time0.hours} : ${time0.minutes} : ${time0.seconds}`;
            }

            function clicked(i) {
                i.classList.add("animated", "flipInY", "open", "show");
            }

            function correct(i) {
                i.classList.remove("shake", "wrong", "flipInY");
                i.classList.add("animated", "match", "rubberBand", "open", "show");
            }

            function worong(i) {
                i.classList.remove("flipInY");
                i.classList.add("animated", "wrong", "shake", "open", "show");
            }

            return {
                drow,
                gttingDeck,
                clicked,
                correct,
                worong,
                timerUpdate,
                moverUpdate,
                rate,
                showNow,
                hideNow,
                updateRate,
                playAgain,
                gameOver
            };
        })();

        const game = (function () {
            let currentClicked = [];

            function runer(even) {
                ui.updateRate();
                // Mengambil elemen kartu bahkan jika user mengklik child element-nya
                let cardTarget = even.target.closest('.card');
                
                if (cardTarget && cardTarget.classList.contains("card")) {
                    if (lock === 0) {
                        lock = 1;
                        window.current.timer();
                    }

                    if (currentClicked.length < 2 && !cardTarget.classList.contains("open")) {
                        fliping(cardTarget);
                        currentClicked.push(cardTarget);
                        if (currentClicked.length === 2) {
                            window.current.addMove();
                            gap(currentClicked);
                            currentClicked = [];
                        }
                    }
                }
            }

            function fliping(tareget) {
                ui.clicked(tareget);
            }

            function gap(currentClicked) {
                setTimeout(function () {
                    judger(currentClicked);
                }, 300);
            }

            function judger(currentClicked) {
                let first = currentClicked[0].firstElementChild.className;
                let second = currentClicked[1].firstElementChild.className;
                if (first === second) {
                    correctGuess(currentClicked);
                } else {
                    wrongGuess(currentClicked);
                }
            }

            function correctGuess(items) {
                window.current.plusTry();
                window.current.addMatched();
                if (window.current.matched === 8) {
                    document.querySelector('#playername').innerHTML = window.current.playerName;
                    ui.updateRate();
                    ui.showNow();
                }
                items.forEach(function (i) {
                    ui.correct(i);
                });
            }

            function wrongGuess(items) {
                window.current.rating();
                items.forEach(function (i) {
                    ui.worong(i);
                    setTimeout(function () {
                        i.classList.remove("animated", "wrong", "shake", "open", "show");
                    }, 800);
                });
            }

            return { runer, wrongGuess, correctGuess, judger, gap, fliping, currentClicked };
        })();

        function int() {
            let gameStarter = document.querySelector(".chose");
            gameStarter.querySelectorAll(".chose-item").forEach(function (i) {
                i.addEventListener("click", function () {
                    if (this.classList.contains("chose-item")) {
                        if (this.classList.contains("active")) {
                            this.classList.remove("active");
                        } else {
                            if (gameStarter.querySelector(".active")) {
                                gameStarter.querySelector(".active").classList.remove("active");
                                this.classList.add("active");
                            } else {
                                this.classList.add("active");
                            }
                        }
                    }
                });
            });

            document.querySelector("#startTheGame").addEventListener('click', function (e) {
                let playername = document.getElementById("palyername");
                if (playername.value !== "" && gameStarter.querySelector(".active")) {
                    let gameType = gameStarter.querySelector(".active").getAttribute("data-type");
                    let data = featch.getData();
                    data.then(function (data) {
                        const gameObject = creatProfile(playername.value, gameType, data);
                        gameObject.current = new gameObject.data.gameState();
                        const current = gameObject.current;
                        window.current = current;
                        current.sethtml(data);

                        function exe() {
                            document.querySelector(".loading").style.zIndex = 50;
                            setTimeout(function () {
                                document.querySelector("#gamestarting").remove();
                                document.querySelector("main").style.display = "block";
                                ui.drow(current.intialHtml);
                            }, 2000);
                        }

                        exe();
                    });
                } else {
                    alert("Make sure you entered your name and chose a card type!");
                }
            });
        }

        int();

        /* ============================================================
           SISTEM NAVIGASI REMOTE STB / ANDROID TV
           ============================================================ */

        const STB_KEYS = {
            LEFT: [37, 21],       // Panah Kiri / D-Pad Left
            UP: [38, 19],         // Panah Atas / D-Pad Up
            RIGHT: [39, 22],      // Panah Kanan / D-Pad Right
            DOWN: [40, 20],       // Panah Bawah / D-Pad Down
            ENTER: [13, 23, 66]   // OK / Select / Enter
        };

        let activeFocusIndex = 0;

        function getFocusableElements() {
            if (document.querySelector("#gamestarting")) {
                return Array.from(document.querySelectorAll("#palyername, .chose-item, #startTheGame"));
            }
            if (document.querySelector("main").style.display === "block") {
                if (document.querySelector("#result").classList.contains("active")) {
                    return Array.from(document.querySelectorAll("#play-again"));
                }
                return Array.from(document.querySelectorAll(".restart, .deck .card"));
            }
            return [];
        }

        function updateFocus(elements) {
            if (!elements || !elements.length) return;
            
            if (activeFocusIndex >= elements.length) activeFocusIndex = elements.length - 1;
            if (activeFocusIndex < 0) activeFocusIndex = 0;

            elements.forEach((el, index) => {
                if (index === activeFocusIndex) {
                    el.focus();
                    el.classList.add("stb-focused");
                } else {
                    el.classList.remove("stb-focused");
                }
            });
        }

        window.addEventListener("keydown", function (e) {
            const focusables = getFocusableElements();
            if (!focusables.length) return;

            const key = e.keyCode;

            if (STB_KEYS.RIGHT.includes(key) || STB_KEYS.DOWN.includes(key)) {
                e.preventDefault();
                activeFocusIndex = (activeFocusIndex + 1) % focusables.length;
                updateFocus(focusables);
            } 
            else if (STB_KEYS.LEFT.includes(key) || STB_KEYS.UP.includes(key)) {
                e.preventDefault();
                activeFocusIndex = (activeFocusIndex - 1 + focusables.length) % focusables.length;
                updateFocus(focusables);
            } 
            else if (STB_KEYS.ENTER.includes(key)) {
                e.preventDefault();
                const currentEl = focusables[activeFocusIndex];
                if (currentEl) {
                    currentEl.click();
                }
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                updateFocus(getFocusableElements());
            }, 500);
        });
    </script>
</body>
