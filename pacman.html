<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Card Game - Responsive TV Landscape Edition</title>
    
    <!-- External Dependencies: Font Awesome & Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        /* CSS Reset & Adaptive Viewport Scaling */
        :root {
          font-size: clamp(10px, 1.5vh, 18px);
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: Arial, sans-serif;
          background-image: url("//ahmedkorim.github.io/udamemoerygame/img/geometry2.png"), linear-gradient(45deg, rgba(46, 61, 73, 0.6), rgba(46, 61, 73, 0.5));
          background-blend-mode: overlay;
          height: 100vh;
          width: 100vw;
          overflow: hidden; /* Mencegah Scrollbar di TV */
          display: flex;
          flex-direction: column;
          justify-content: center;
          position: relative;
        }

        /* Styling Watermark Pojok Kiri Atas */
        .watermark {
          position: fixed;
          top: 15px;
          left: 20px;
          z-index: 9999;
          color: rgba(255, 255, 255, 0.6);
          font-size: 1.2rem;
          font-weight: bold;
          letter-spacing: 1.5px;
          text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
          pointer-events: none;
          user-select: none;
        }

        main {
          display: none;
          height: 100vh;
          width: 100vw;
        }

        .container {
          width: 90vw;
          max-width: 1200px;
          margin: auto;
        }

        .row {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .AK-btn {
          position: relative;
          width: 60%;
          margin: 1.5vh auto;
        }
        .AK-btn button, .AK-btn input {
          box-shadow: -2px 7px 20px 2px rgba(46, 61, 73, 0.35);
          border-radius: 12px;
          color: #FFFFFF;
          outline: none;
          border: none;
          display: block;
          font-size: 1.2rem;
          padding: 0.8vh 0.5rem;
          width: 100%;
          transition: all 0.3s ease-in-out;
          background-color: #2e3d49;
        }
        .AK-btn button, .AK-btn input[type=submit] {
          cursor: pointer;
        }
        .AK-btn button:hover, .AK-btn button:focus, .AK-btn button:active, 
        .AK-btn input[type=submit]:hover, .AK-btn input[type=submit]:focus, .AK-btn input[type=submit]:active {
          box-shadow: -2px 7px 20px 2px rgba(255, 255, 255, 0.05);
          background-color: #e3e3e3;
          color: #2e3d49;
        }

        .stars {
          padding: 0;
          margin-right: auto;
          display: flex;
          list-style: none;
        }
        .stars li {
          color: gold;
          display: inline-block;
          font-size: 1.2rem;
        }

        .text-center {
          text-align: center;
        }

        .img-resposive {
          max-width: 80%;
          max-height: 80%;
          pointer-events: none;
        }

        header h1 {
          text-align: center;
          color: #fff;
          font-size: 1.8rem;
          margin-top: 1vh;
        }

        .score-panel {
          margin-bottom: 1vh;
        }

        .score-panel .wraper, #result .modal-body, #gamestarting .wraper {
          justify-content: center;
          align-items: center;
          margin: auto;
          display: flex;
          width: 80%;
        }

        .score-panel .col {
          padding: 0.5vh;
          display: flex;
          justify-content: center;
          align-items: center;
          color: #fff;
          font-size: 1.1rem;
        }

        .score-panel .col:first-of-type, .score-panel .col:nth-of-type(2) {
          width: 50%;
        }

        .score-panel .restart {
          overflow: hidden;
          margin-left: 1rem;
          cursor: pointer;
          padding: 5px 12px;
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.1);
        }

        .score-panel .moves {
          margin: auto;
        }

        /* Responsive Layout Kartu Utama */
        .card-home {
          height: 75vh;
          display: flex;
          align-items: center;
        }

        .card-home .game-body {
          height: 100%;
          display: flex;
          align-items: center;
        }

        .card-home .game-wraper {
          width: 100%;
          height: 100%;
        }

        .card-home .deck, #gamestarting .wraper, #result .modal-content {
          background: linear-gradient(160deg, #02ccba 0%, #aa7ecd 100%);
          border-radius: 12px;
          box-shadow: 12px 15px 20px 0 rgba(46, 61, 73, 0.5);
          padding: 1.5vh;
          margin: auto;
        }

        .card-home .deck {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          grid-template-rows: repeat(4, 1fr);
          gap: 1.5vh;
          width: min(70vh, 80vw);
          height: min(70vh, 80vw);
          list-style: none;
        }

        .card-home .deck li.card, #gamestarting .callToAction .chose .chose-item {
          background: #2e3d49;
          color: #2e3d49;
          border-radius: 8px;
          cursor: pointer;
          box-shadow: 5px 2px 15px 0 rgba(46, 61, 73, 0.5);
        }

        .card-home .deck li.card {
          font-size: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          height: 100%;
          margin: 0;
        }

        .card-home .deck li.card .img-resposive {
          visibility: hidden;
        }
        .card-home .deck li.card.open {
          transform: rotateY(0);
          background: #ffffff;
          cursor: default;
        }
        .card-home .deck li.card.show {
          font-size: 2rem;
        }
        .card-home .deck li.card.show .img-resposive {
          visibility: visible;
        }
        .card-home .deck li.card.match {
          cursor: default;
          background: #02ccba;
          font-size: 2rem;
        }
        .card-home .deck li.card.wrong {
          background: #e5534d;
        }

        /* Screen Tampilan Awal */
        #gamestarting {
          text-align: center;
          height: 100vh;
          display: flex;
          align-items: center;
        }
        #gamestarting .row {
          justify-content: center;
          align-items: center;
          width: 100%;
        }
        #gamestarting h1 {
          font-size: 2rem;
          margin-bottom: 1vh;
        }
        #gamestarting p {
          text-align: center;
          font-size: 1.2rem;
          margin-bottom: 1vh;
        }
        #gamestarting .col {
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        #gamestarting .wraper {
          position: relative;
          padding: 2vh 2vw;
          flex-direction: column;
          max-width: 700px;
        }
        #gamestarting .loading {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 12px;
          top: 0;
          left: 0;
          background-color: #fff;
          overflow: hidden;
          z-index: -1;
        }
        #gamestarting .loading img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #gamestarting .callToAction {
          margin: auto;
          width: 100%;
        }
        #gamestarting .callToAction .chose {
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
          margin: 2vh auto;
        }
        #gamestarting .callToAction .chose .chose-item {
          position: relative;
          width: 22%;
          height: 12vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 1vh;
        }
        #gamestarting .callToAction .chose .chose-item.active .chose-icon {
          opacity: 1;
        }
        #gamestarting .callToAction .chose .chose-item .chose-icon {
          transition: all 0.3s ease-in-out;
          position: absolute;
          top: 0.3rem;
          left: 0.3rem;
          font-size: 1.2rem;
          opacity: 0;
          color: #1aee1a;
        }

        /* Modal Hasil */
        #result {
          overflow: hidden;
          background-color: rgba(0, 0, 0, 0.7);
          height: 100vh;
          width: 100vw;
          position: fixed;
          top: 0;
          left: 0;
          display: none;
          z-index: 100;
        }
        #result.active {
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #result .modal {
          transition: all 0.5s ease-in-out;
          width: 100%;
          display: flex;
          justify-content: center;
        }
        #result p {
          font-size: 1.5rem;
          margin-bottom: 2vh;
        }
        #result .modal-content {
          padding: 4vh;
          max-width: 500px;
        }

        /* High Visibility STB Remote Focus Indicator */
        .stb-focused {
          outline: 4px solid #FFD700 !important;
          outline-offset: 2px !important;
          box-shadow: 0 0 25px #FFD700 !important;
          transform: scale(1.05);
          z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Watermark Pojok Kiri Atas -->
    <div class="watermark">mrzyb</div>

    <!-- Main Game Section -->
    <main>
        <header>
            <div class="container">
                <div class="row">
                    <div class="col">
                        <h1 id="player-name"></h1>
                    </div>
                </div>
            </div>
        </header>
        <section class="score-panel">
            <div class="container">
                <div class="row">
                    <div class="wraper">
                        <div class="col">
                            <ul class="stars">
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                                <li><i class="fa fa-star"></i></li>
                            </ul>
                            <div class="timer" style="margin-left: 15px;">
                                <span>00 : 00 : 00</span>
                            </div>
                        </div>
                        <div class="col">
                            <!-- Tombol Kembali Ke Menu Utama -->
                            <div class="restart" id="btn-back-menu" tabindex="0" title="Kembali ke Menu">
                                <i class="fa fa-home"></i> Menu
                            </div>
                            <div class="restart" id="btn-restart-game" tabindex="0" title="Ulang Game">
                                <i class="fa fa-rotate-right"></i> Restart
                            </div>
                            <div class="moves"> Moves : 0</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <section class="card-home">
            <div class="container game-body">
                <div class="row game-wraper">
                    <ul class="deck">
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <!-- Game Starter Screen (Tanpa Fitur Nama) -->
    <section id="gamestarting">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="wraper">
                        <div class="loading">
                            <img src="//ahmedkorim.github.io/udamemoerygame/img/loading.gif" alt="loading">
                        </div>
                        <h1>Matching Card Game</h1>
                        <p>Select Card Category & Press Start</p>
                        <div class="callToAction" id="newplayer">
                            <div class="chose">
                                <div class="chose-item active" data-type="pakemonGo" title="pakemonGo cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/pakemonGo/pikachu-2.svg" alt="pokemon">
                                </div>
                                <div class="chose-item" data-type="eduction" title="eduction cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/eduction/eraser.svg" alt="education">
                                </div>
                                <div class="chose-item" data-type="socialicons" title="socialicons cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/socialicons/008-twitter.svg" alt="twitter">
                                </div>
                                <div class="chose-item" data-type="icons" title="icons cards" tabindex="0">
                                    <span class="chose-icon"><i class="fa fa-check-square"></i></span>
                                    <img class="img-resposive" src="//ahmedkorim.github.io/udamemoerygame/img/socialicons/012-spotify.svg" alt="spotify">
                                </div>
                            </div>
                            <div class="AK-btn">
                                <input type="submit" value="Start Game" class="AK-btn" id="startTheGame" tabindex="0">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Game Result Modal Screen -->
    <section id="result">
        <div class="modal">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="modal-body">
                            <div class="modal-content text-center">
                                <p>Congratulations, You Won!</p>
                                <ul class="stars" style="justify-content: center; margin-bottom: 2vh;">
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                    <li><i class="fa fa-star"></i></li>
                                </ul>
                                <div class="AK-btn" style="margin-bottom: 1vh;"><button id="play-again" tabindex="0">Play Again</button></div>
                                <div class="AK-btn"><button id="btn-result-menu" tabindex="0">Main Menu</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript Engine -->
    <script>
        let lock = 0, star;

        const featch = (function () {
            async function getData() {
                const data = await fetch("https://ahmedkorim.github.io/udamemoerygame/remotedata.json");
                const list = await data.json();
                return list;
            }
            return { getData };
        })();

        const cardsCreartor = (function () {
            function getCareds(cards) {
                let number = cards.length,
                    randomCards = [],
                    indexes = [],
                    rand;
                for (let i = 0; i < number; i++) {
                    rand = Math.floor(Math.random() * number);
                    if (!indexes.includes(rand) && randomCards.length <= cards.length) {
                        indexes.push(rand);
                        randomCards[i] = cards[rand];
                    } else {
                        i--;
                    }
                }
                return randomCards;
            }

            function eventLoeder(deck) {
                deck.addEventListener("click", function (e) {
                    game.runer(e);
                });
            }

            return {
                getCards: getCareds,
                eventLoeder
            };
        })();

        function creatProfile(gameType, cards) {
            const data = (function (gameType, cards) {
                class gameState {
                    constructor() {
                        this.moves = 0;
                        this.level = 0;
                        this.gameType = gameType;
                        this.time = {seconds: 0, minutes: 0, hours: 0};
                        this.interval = null;
                        this.deck = ui.gttingDeck();
                        this.gameData = null;
                        this.intialHtml = null;
                        this.initialRate = document.querySelector('.stars').innerHTML;
                        this.curentRate = document.querySelector(".stars").children.length;
                        this.matched = 0;
                    }

                    addMatched() {
                        this.matched += 1;
                    }

                    levelUp() {
                        this.level += 1;
                    }

                    addMove() {
                        this.moves += 1;
                        ui.moverUpdate();
                    }

                    timer() {
                        const time = this.time;
                        this.interval = setInterval(function () {
                            if (time.seconds < 59) {
                                time.seconds++;
                            } else if (time.seconds === 59) {
                                time.seconds = 0;
                                if (time.minutes <= 59) {
                                    time.minutes++;
                                } else {
                                    time.minutes = 0;
                                    time.hours++;
                                }
                            }
                            ui.timerUpdate(time);
                        }, 1000);
                    }

                    gameHtml() {
                        this.gameData = this.deck.innerHTML;
                    }

                    sethtml(cardsData) {
                        this.gameData = cardsData;
                        let cardsArr = cardsData[this.gameType];
                        cardsArr = cardsCreartor.getCards(cardsArr);
                        
                        let tempDiv = document.createElement('div');
                        let placeHodlder = "";
                        cardsArr.forEach(function (i) {
                            placeHodlder += i;
                        });
                        tempDiv.innerHTML = placeHodlder;
                        
                        tempDiv.querySelectorAll('li').forEach(li => {
                            li.setAttribute('tabindex', '0');
                        });
                        
                        this.intialHtml = tempDiv.innerHTML;
                    }

                    rating() {
                        if (this.moves / 9 > 1 && this.curentRate > 1) {
                            this.curentRate--;
                            ui.rate(this.curentRate);
                        }
                    }

                    plusTry() {
                        if (this.moves / 9 > 1 && this.curentRate <= 8) {
                            this.curentRate++;
                            star = document.createElement("li");
                            star.innerHTML = '<i class="fa fa-star"></i>';
                            document.querySelector("ul.stars").appendChild(star);
                        }
                    }
                }

                return { gameState };
            })(gameType, cards);

            return { data, current: null };
        }

        const ui = (function () {
            function updateRate() {
                let data = document.querySelector('.stars').innerHTML;
                if(window.current) window.current.initialRate = data;
                document.querySelector('#result .stars').innerHTML = data;
            }

            document.querySelector('#btn-restart-game').addEventListener('click', function () {
                ui.playAgain();
            });

            document.querySelector('#btn-back-menu').addEventListener('click', function () {
                backToMainMenu();
            });

            document.querySelector('#btn-result-menu').addEventListener('click', function () {
                backToMainMenu();
            });

            function hideNow() {
                document.querySelector('#result').classList.remove("active");
            }

            function showNow() {
                document.querySelector('#play-again').onclick = function () {
                    ui.hideNow();
                    ui.playAgain();
                };

                document.querySelector('#result').classList.add("active");
                setTimeout(() => {
                    const focusables = getFocusableElements();
                    if(focusables.length) setFocus(focusables[0]);
                }, 100);
            }

            function gameOver(state) {
                ui.showNow();
            }

            function playAgain() {
                document.querySelector(".stars").innerHTML = window.current.initialRate;
                clearInterval(window.current.interval);
                lock = 0;
                window.current.moves = 0;
                ui.moverUpdate();
                window.current.level = 0;
                window.current.time = {seconds: 0, minutes: 0, hours: 0};
                ui.timerUpdate(window.current.time);
                window.current.interval = void 0;
                game.currentClicked = [];
                window.current.matched = 0;
                window.current.sethtml(window.current.gameData);
                ui.drow(window.current.intialHtml);
            }

            function rate(starIndex) {
                document.querySelector(".stars").children[starIndex]?.remove();
            }

            function gttingDeck() {
                return document.querySelector(".deck");
            }

            function drow(html) {
                let deck = gttingDeck();
                deck.innerHTML = "";
                deck.innerHTML = html;
                document.querySelector("#player-name").innerHTML = `${window.current.gameType} Matching`;
                
                deck.querySelectorAll('.card').forEach(function (i) {
                    i.setAttribute('tabindex', '0');
                });
                
                cardsCreartor.eventLoeder(deck);
                
                setTimeout(() => {
                    const focusables = getFocusableElements();
                    if(focusables.length) setFocus(focusables[0]);
                }, 100);
            }

            function moverUpdate() {
                document.querySelector(".moves").innerHTML = `Moves : ${window.current.moves}`;
            }

            function timerUpdate(time) {
                const timer = document.querySelector('.timer span');
                let time0 = {};

                for (let i in time) {
                    time0[i] = time[i] < 10 ? "0" + time[i] : time[i];
                }

                timer.innerHTML = `${time0.hours} : ${time0.minutes} : ${time0.seconds}`;
            }

            function clicked(i) {
                i.classList.add("animated", "flipInY", "open", "show");
            }

            function correct(i) {
                i.classList.remove("shake", "wrong", "flipInY");
                i.classList.add("animated", "match", "rubberBand", "open", "show");
            }

            function worong(i) {
                i.classList.remove("flipInY");
                i.classList.add("animated", "wrong", "shake", "open", "show");
            }

            return {
                drow,
                gttingDeck,
                clicked,
                correct,
                worong,
                timerUpdate,
                moverUpdate,
                rate,
                showNow,
                hideNow,
                updateRate,
                playAgain,
                gameOver
            };
        })();

        const game = (function () {
            let currentClicked = [];

            function runer(even) {
                ui.updateRate();
                let cardTarget = even.target.closest('.card');
                
                if (cardTarget && cardTarget.classList.contains("card")) {
                    if (lock === 0) {
                        lock = 1;
                        window.current.timer();
                    }

                    if (currentClicked.length < 2 && !cardTarget.classList.contains("open")) {
                        fliping(cardTarget);
                        currentClicked.push(cardTarget);
                        if (currentClicked.length === 2) {
                            window.current.addMove();
                            gap(currentClicked);
                            currentClicked = [];
                        }
                    }
                }
            }

            function fliping(tareget) {
                ui.clicked(tareget);
            }

            function gap(currentClicked) {
                setTimeout(function () {
                    judger(currentClicked);
                }, 300);
            }

            function judger(currentClicked) {
                let first = currentClicked[0].firstElementChild.className;
                let second = currentClicked[1].firstElementChild.className;
                if (first === second) {
                    correctGuess(currentClicked);
                } else {
                    wrongGuess(currentClicked);
                }
            }

            function correctGuess(items) {
                window.current.plusTry();
                window.current.addMatched();
                if (window.current.matched === 8) {
                    ui.updateRate();
                    ui.showNow();
                }
                items.forEach(function (i) {
                    ui.correct(i);
                });
            }

            function wrongGuess(items) {
                window.current.rating();
                items.forEach(function (i) {
                    ui.worong(i);
                    setTimeout(function () {
                        i.classList.remove("animated", "wrong", "shake", "open", "show");
                    }, 800);
                });
            }

            return { runer, wrongGuess, correctGuess, judger, gap, fliping, currentClicked };
        })();

        /* FUNGSI KEMBALI KE MENU AWAL (PEMILIHAN KARTU) */
        function backToMainMenu() {
            if (window.current && window.current.interval) {
                clearInterval(window.current.interval);
            }
            lock = 0;
            
            document.querySelector("main").style.display = "none";
            document.querySelector("#result").classList.remove("active");
            document.querySelector("#gamestarting").style.display = "flex";
            document.querySelector(".loading").style.zIndex = -1;

            setTimeout(() => {
                const focusables = getFocusableElements();
                if (focusables.length) setFocus(focusables[0]);
            }, 100);
        }

        function int() {
            let gameStarter = document.querySelector(".chose");
            gameStarter.querySelectorAll(".chose-item").forEach(function (i) {
                i.addEventListener("click", function () {
                    if (this.classList.contains("chose-item")) {
                        if (this.classList.contains("active")) {
                            this.classList.remove("active");
                        } else {
                            if (gameStarter.querySelector(".active")) {
                                gameStarter.querySelector(".active").classList.remove("active");
                                this.classList.add("active");
                            } else {
                                this.classList.add("active");
                            }
                        }
                    }
                });
            });

            document.querySelector("#startTheGame").addEventListener('click', function (e) {
                if (gameStarter.querySelector(".active")) {
                    let gameType = gameStarter.querySelector(".active").getAttribute("data-type");
                    let data = featch.getData();
                    data.then(function (data) {
                        const gameObject = creatProfile(gameType, data);
                        gameObject.current = new gameObject.data.gameState();
                        const current = gameObject.current;
                        window.current = current;
                        current.sethtml(data);

                        function exe() {
                            document.querySelector(".loading").style.zIndex = 50;
                            setTimeout(function () {
                                document.querySelector("#gamestarting").style.display = "none";
                                document.querySelector("main").style.display = "block";
                                ui.drow(current.intialHtml);
                            }, 1500);
                        }

                        exe();
                    });
                } else {
                    alert("Silakan pilih kategori kartu terlebih dahulu!");
                }
            });
        }

        int();

        /* ============================================================
           SISTEM NAVIGASI SPASIAL 2D REMOTE STB & HANDLER TOMBOL BACK
           ============================================================ */

        const STB_KEYS = {
            LEFT: [37, 21],
            UP: [38, 19],
            RIGHT: [39, 22],
            DOWN: [40, 20],
            ENTER: [13, 23, 66],
            BACK: [8, 27, 461, 10009, 88] // Backspace, ESC, dan KeyCode Back TV
        };

        let currentFocusedElement = null;

        function getFocusableElements() {
            if (document.querySelector("#result").classList.contains("active")) {
                return Array.from(document.querySelectorAll("#play-again, #btn-result-menu"));
            }
            if (document.querySelector("#gamestarting").style.display !== "none") {
                return Array.from(document.querySelectorAll(".chose-item, #startTheGame"));
            }
            if (document.querySelector("main").style.display === "block") {
                return Array.from(document.querySelectorAll("#btn-back-menu, #btn-restart-game, .deck .card"));
            }
            return [];
        }

        function setFocus(targetEl) {
            if (!targetEl) return;
            
            const allFocusables = getFocusableElements();
            allFocusables.forEach(el => el.classList.remove("stb-focused"));

            currentFocusedElement = targetEl;
            currentFocusedElement.focus();
            currentFocusedElement.classList.add("stb-focused");
        }

        function getNextSpatialFocus(direction) {
            const focusables = getFocusableElements();
            if (!focusables.length) return null;

            if (!currentFocusedElement || !focusables.includes(currentFocusedElement)) {
                return focusables[0];
            }

            const currentRect = currentFocusedElement.getBoundingClientRect();
            const currentCenter = {
                x: currentRect.left + currentRect.width / 2,
                y: currentRect.top + currentRect.height / 2
            };

            let bestCandidate = null;
            let shortestDistance = Infinity;

            focusables.forEach(el => {
                if (el === currentFocusedElement) return;

                const rect = el.getBoundingClientRect();
                const center = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };

                const dx = center.x - currentCenter.x;
                const dy = center.y - currentCenter.y;

                let isInDirection = false;
                if (direction === "LEFT" && dx < -5) isInDirection = true;
                if (direction === "RIGHT" && dx > 5) isInDirection = true;
                if (direction === "UP" && dy < -5) isInDirection = true;
                if (direction === "DOWN" && dy > 5) isInDirection = true;

                if (isInDirection) {
                    let mainAxis = (direction === "LEFT" || direction === "RIGHT") ? Math.abs(dx) : Math.abs(dy);
                    let crossAxis = (direction === "LEFT" || direction === "RIGHT") ? Math.abs(dy) : Math.abs(dx);
                    
                    let weightedDistance = mainAxis + (crossAxis * 2.5);

                    if (weightedDistance < shortestDistance) {
                        shortestDistance = weightedDistance;
                        bestCandidate = el;
                    }
                }
            });

            return bestCandidate || currentFocusedElement;
        }

        window.addEventListener("keydown", function (e) {
            const key = e.keyCode;
            let direction = null;

            if (STB_KEYS.LEFT.includes(key)) direction = "LEFT";
            else if (STB_KEYS.RIGHT.includes(key)) direction = "RIGHT";
            else if (STB_KEYS.UP.includes(key)) direction = "UP";
            else if (STB_KEYS.DOWN.includes(key)) direction = "DOWN";

            if (direction) {
                e.preventDefault();
                const nextEl = getNextSpatialFocus(direction);
                if (nextEl) setFocus(nextEl);
            } 
            else if (STB_KEYS.ENTER.includes(key)) {
                e.preventDefault();
                if (currentFocusedElement) {
                    currentFocusedElement.click();
                }
            }
            // TANGKAP TOMBOL BACK REMOTE / HP
            else if (STB_KEYS.BACK.includes(key)) {
                if (document.querySelector("main").style.display === "block" || 
                    document.querySelector("#result").classList.contains("active")) {
                    e.preventDefault();
                    backToMainMenu();
                }
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const initialFocusables = getFocusableElements();
                if (initialFocusables.length > 0) {
                    setFocus(initialFocusables[0]);
                }
            }, 300);
        });
    </script>
</body>
</html>
