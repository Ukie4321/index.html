<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRZYB-HT BLACK EDITION</title>
  <style>
    /* --- SYSTEM VARIABLES FOR THEMES --- */
    :root {
      --bg-main: #000000;
      --ht-bg: #121212;
      --ht-border: #333333;
      --text-color: #a3e635;
      --screen-bg: #050505;
      --screen-border: #222222;
      --panel-bg: #080808;
      --btn-bg: #222222;
      --btn-border: #444444;
      --slider-thumb: #a3e635;
      
      /* Fullscreen Chat Variables (Default Black/Green Cyber) */
      --fs-bg: #0b141a;
      --fs-bg-pattern: #182229;
      --fs-header-bg: #1f2c34;
      --fs-header-border: #2a3942;
      --fs-text: #e9edef;
      --fs-accent: #a3e635;
      --fs-input-bg: #2a3942;
      --fs-bubble-bg: #1f2c34;
      --fs-bubble-border: #334155;
      --wa-green: #00a884;
    }

    /* --- TEMA HIJAU --- */
    .theme-green { 
      --ht-bg: #1b2612; 
      --ht-border: #3f5e22; 
      --text-color: #86efac;
      --screen-bg: #1a3300;
      --screen-border: #4d8000;
      --panel-bg: #142900;
      --btn-bg: #142900;
      --btn-border: #3f5e22;
      --slider-thumb: #86efac;

      /* Fullscreen Theme Green */
      --fs-bg: #0c1a09;
      --fs-bg-pattern: #132b10;
      --fs-header-bg: #163312;
      --fs-header-border: #254a1f;
      --fs-text: #dcfce7;
      --fs-accent: #4ade80;
      --fs-input-bg: #1f421a;
      --fs-bubble-bg: #163312;
      --fs-bubble-border: #2e5c26;
      --wa-green: #22c55e;
    }

    /* --- TEMA PINK --- */
    .theme-pink { 
      --ht-bg: #2a0818; 
      --ht-border: #831843; 
      --text-color: #f472b6;
      --screen-bg: #3b0724;
      --screen-border: #9d174d;
      --panel-bg: #1f0412;
      --btn-bg: #4c052e;
      --btn-border: #831843;
      --slider-thumb: #f472b6;

      /* Fullscreen Theme Pink */
      --fs-bg: #1a0410;
      --fs-bg-pattern: #2b081c;
      --fs-header-bg: #380b25;
      --fs-header-border: #58123b;
      --fs-text: #fce7f3;
      --fs-accent: #f472b6;
      --fs-input-bg: #4d1033;
      --fs-bubble-bg: #380b25;
      --fs-bubble-border: #6b1849;
      --wa-green: #ec4899;
    }

    body { background-color: var(--bg-main); color: var(--text-color); font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    
    .ht-body { background: var(--ht-bg); border: 4px solid var(--ht-border); border-radius: 20px; padding: 20px; width: 90%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; transition: all 0.3s; }
    .ht-body *:not(.ptt-btn):not(.ptt-btn *) { color: var(--text-color) !important; }

    /* --- PTT BUTTON (WHATSAPP MIC STYLE) --- */
    .ptt-container { text-align: center; margin-top: 10px; }
    .ptt-btn { 
      background: var(--wa-green) !important; 
      color: #ffffff !important; 
      border: none !important;
      border-radius: 50% !important;
      width: 90px; 
      height: 90px; 
      margin: 0 auto; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: bold; 
      font-family: inherit; 
      cursor: pointer; 
      user-select: none; 
      touch-action: manipulation;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4) !important;
      transition: all 0.2s;
    }
    .ptt-btn:active {
      transform: scale(1.08);
      background: #b91c1c !important;
      box-shadow: 0 0 20px rgba(185, 28, 28, 0.8) !important;
    }
    .ptt-btn svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }
    
    .ptt-btn.locked {
      background: #ef4444 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8) !important;
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .lock-btn {
      margin-top: 8px;
      font-size: 10px;
      padding: 4px 10px;
      background: #181818;
      color: #f59e0b !important;
      border: 1px solid #f59e0b;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .screen { background: var(--screen-bg); border: 2px solid var(--screen-border); padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: center; position: relative; }
    .status-bar { display: flex; justify-content: space-between; font-size: 9px; color: #888; margin-bottom: 4px; }
    .signal-meter { font-weight: bold; letter-spacing: 1px; }
    .freq { font-size: 26px; font-weight: bold; line-height: 1.1; word-break: break-all; }

    .user-list { border: 1px solid var(--screen-border); background: var(--panel-bg); padding: 8px; border-radius: 5px; margin-bottom: 12px; font-size: 11px; }
    .user-count { font-weight: bold; }
    .user-names { color: #888; font-size: 10px; margin-top: 4px; word-break: break-all; }

    .chat-box { background: var(--screen-bg); height: 110px; overflow-y: auto; border: 1px solid var(--screen-border); padding: 8px; font-size: 11px; margin-bottom: 8px; border-radius: 5px; color: #ccc; word-wrap: break-word; }
    .chat-box a { color: #60a5fa !important; text-decoration: underline; font-weight: bold; word-break: break-all; }
    .chat-img-thumb { max-width: 100%; max-height: 120px; border-radius: 5px; border: 1px solid #444; margin-top: 4px; cursor: pointer; display: block; }
    
    .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
    input, select { flex: 1; background: var(--screen-bg); border: 1px solid var(--btn-border); color: var(--text-color); padding: 8px; border-radius: 3px; font-family: inherit; }
    button { background: var(--btn-bg); color: var(--text-color); border: 1px solid var(--btn-border); padding: 8px 12px; cursor: pointer; border-radius: 3px; }
    
    .quick-btns { display: flex; gap: 4px; margin-bottom: 10px; }
    .quick-btn { flex: 1; font-size: 9px; padding: 4px; background: var(--btn-bg); border: 1px solid var(--btn-border); }
    
    .error-msg { color: #ef4444 !important; font-size: 11px; text-align: center; margin-bottom: 10px; display: none; }
    .status { text-align: center; font-size: 11px; margin-top: 5px; color: #888; }
    .private-badge { font-size: 10px; color: #f59e0b !important; margin-top: 2px; }
    .radio-panel { border: 1px dashed var(--btn-border); padding: 8px; border-radius: 5px; margin-bottom: 12px; background: var(--panel-bg); }
    .time-stamp { color: #555 !important; font-size: 9px; margin-right: 4px; }

    .extra-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 10px; background: var(--panel-bg); padding: 6px; border-radius: 5px; border: 1px solid var(--screen-border); gap: 4px; flex-wrap: wrap; }
    .extra-tools label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .white-icon { filter: brightness(0) invert(1); display: inline-block; vertical-align: middle; margin-right: 4px; }
    
    .modern-slider { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
    .modern-slider::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #222; border-radius: 5px; }
    .modern-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--slider-thumb); margin-top: -5px; box-shadow: 0 0 5px var(--slider-thumb); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: var(--ht-bg); border: 2px solid var(--ht-border); padding: 20px; border-radius: 10px; width: 80%; max-width: 280px; text-align: center; box-shadow: 0 0 15px rgba(0,0,0,0.9); position: relative; }
    .modal-text { color: #ccc !important; font-size: 12px; margin-bottom: 15px; line-height: 1.4; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btn-ok { background: #b91c1c; color: #fff !important; border: 1px solid #ef4444; padding: 6px 15px; font-size: 11px; cursor: pointer; }
    .modal-btn-cancel { background: #222; color: #888 !important; border: 1px solid #444; padding: 6px 15px; font-size: 11px; cursor: pointer; }

    .close-x-btn { position: absolute; top: 8px; right: 12px; background: transparent; border: none; color: #ef4444 !important; font-size: 18px; font-weight: bold; cursor: pointer; padding: 0; }
    .compass-circle-outer { width: 140px; height: 140px; border: 3px solid #f59e0b; border-radius: 50%; margin: 10px auto; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
    .compass-dial { position: absolute; width: 100%; height: 100%; border-radius: 50%; transition: transform 0.1s ease-out; }
    .compass-mark-u { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); color: #ef4444 !important; font-weight: bold; font-size: 12px; }
    .compass-mark-s { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); color: #fff !important; font-size: 10px; }
    .compass-mark-t { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); color: #fff !important; font-size: 10px; }
    .compass-mark-b { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: #fff !important; font-size: 10px; }
    .compass-pointer { width: 4px; height: 50px; background: linear-gradient(to bottom, #ef4444 50%, #ffffff 50%); position: absolute; border-radius: 2px; }

    /* --- FULLSCREEN CHAT OVERLAY --- */
    .fullscreen-chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--fs-bg);
      z-index: 9999;
      flex-direction: column;
      transition: background 0.3s;
    }
    
    .fullscreen-chat-overlay.active { display: flex; }
    .fs-header { background: var(--fs-header-bg); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--fs-header-border); color: var(--fs-text); }
    .fs-header-title { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 8px; color: var(--fs-text) !important; }
    .fs-header-title span { color: var(--fs-accent) !important; }
    .fs-chat-body { flex: 1; padding: 15px; overflow-y: auto; background-color: var(--fs-bg); background-image: radial-gradient(var(--fs-bg-pattern) 1px, transparent 1px); background-size: 16px 16px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .fs-chat-body * { color: var(--fs-text) !important; }
    .fs-chat-footer { background: var(--fs-header-bg); padding: 10px 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--fs-header-border); }
    .fs-chat-footer input { background: var(--fs-input-bg); border: none; color: var(--fs-text) !important; padding: 12px; border-radius: 20px; font-size: 14px; outline: none; }
    .fs-chat-footer button { background: var(--fs-accent); color: #000 !important; border: none; border-radius: 50%; width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; font-weight: bold; }
    
    /* Fullscreen WhatsApp Mic Icon Button */
    .fs-ptt-btn { 
      background: var(--wa-green) !important; 
      color: #fff !important; 
      border: none; 
      border-radius: 50%; 
      width: 42px; 
      height: 42px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      user-select: none; 
      touch-action: manipulation; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.4); 
      transition: all 0.2s; 
    }
    .fs-ptt-btn:active { background: #b91c1c !important; transform: scale(1.15); }
    .fs-ptt-btn svg { width: 22px; height: 22px; fill: #ffffff; }

    .vn-player-bubble { display: inline-flex; align-items: center; gap: 8px; background: var(--fs-bubble-bg); border: 1px solid var(--fs-bubble-border); padding: 4px 10px; border-radius: 12px; margin-top: 4px; margin-bottom: 2px; }
    .vn-play-btn { background: var(--fs-accent) !important; color: #000 !important; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-weight: bold; }
    .vn-label { font-size: 10px; color: var(--fs-accent) !important; font-weight: bold; }
  </style>
</head>
<body>

<input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleGalleryUpload(event)">

<div class="ht-body" id="htContainer">
  <div style="text-align: center; margin-bottom: 10px;">
    <img src="logo.png" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%;" onerror="this.style.display='none'">
  </div>

  <h2 style="text-align: center; margin-top: 0; font-size: 18px; letter-spacing: 2px;">MRZYB-HT</h2>

  <div class="screen">
    <div class="status-bar">
      <span class="signal-meter" id="rssiMeter">SIG: ▂▄▆█</span>
      <span id="scanStatus">SCAN: OFF</span>
      <span id="batDisplay">BAT: --% 🔋</span>
    </div>
    <div class="freq" id="freqDisplay">145.820</div>
    <div id="privateBadge" class="private-badge"></div>
  </div>

  <div class="extra-tools">
    <button onclick="triggerCamera()" style="font-size: 9px; padding: 3px 5px; background: #0284c7; border-color: #38bdf8; color: #fff !important;">📷 FOTO</button>
    <button onclick="triggerGallery()" style="font-size: 9px; padding: 3px 5px; background: #059669; border-color: #34d399; color: #fff !important;">🖼️ GALERI</button>
    <button onclick="openCompassModal()" style="font-size: 9px; padding: 3px 5px;">🧭 KOMPAS</button>
    <button onclick="sendGPSLocation()" style="font-size: 9px; padding: 3px 5px;">📍 GPS</button>
    <button onclick="toggleScan()" style="font-size: 9px; padding: 3px 5px;" id="scanBtn">
      <span class="white-icon">🔍</span> SCAN
    </button>
    <button onclick="toggleTheme()" style="font-size: 9px; padding: 3px 5px;">🎨 TEMA</button>
    <label>
      <input type="checkbox" id="ttsToggle" style="flex:none;"> 
      <span class="white-icon">🔊</span> TTS
    </label>
  </div>

  <div class="radio-panel">
    <div style="font-size: 10px; color: #888; margin-bottom: 5px; text-align: center;">📻 MONITORING RADIO FM</div>
    <div class="input-group" style="margin-bottom: 4px;">
      <select id="radioSelect" onchange="changeRadioChannel()">
        <option value="https://n08.radiojar.com/7csmg90fuqruv.mp3?1673348819=&rj-tok=AAABhZtmUCUAwkYyBBgriH-X9g&rj-ttl=5">HardRock</option>
        <option value="https://n0a.radiojar.com/4ywdgup3bnzuv?1673348637=&rj-tok=AAABhZtjYesAbqf2VnMskbfVxQ&rj-ttl=5">Iswara</option>
        <option value="https://stream.denger.in/">Dmi</option>
        <option value="https://stream.rcs.revma.com/ugpyzu9n5k3vv">Musik Indonesia</option>
      </select>
      <button id="radioBtn" onclick="toggleRadio()">PLAY</button>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; font-size: 9px; color: #888;">
      <span>VOL:</span>
      <input type="range" id="radioVol" class="modern-slider" min="0" max="1" step="0.05" value="0.8" oninput="adjustRadioVolume(this.value)">
    </div>
  </div>
  <audio id="radioPlayer" crossorigin="anonymous"></audio>

  <div id="errorAlert" class="error-msg"></div>

  <div class="user-list">
    <span>Online: </span><span class="user-count" id="onlineCount">0</span>
    <div class="user-names" id="namesList">Belum ada user</div>
  </div>

  <div class="input-group">
    <input type="text" id="nickInput" placeholder="Callsign/Nama...">
  </div>

  <div class="input-group">
    <select id="groupSelect" onchange="switchGroupFromDropdown()">
      <option value="145.820||">🌐 General (145.820)</option>
    </select>
    <button onclick="openCreateGroupModal()" style="font-size: 11px; background: #065f46; border-color: #10b981; color: #fff !important;">➕ GRUP</button>
  </div>

  <div class="input-group">
    <input type="text" id="freqInput" placeholder="Freq/Grup ID (misal: 145.820)">
  </div>
  <div class="input-group">
    <input type="password" id="passInput" placeholder="Password Private (jika ada)">
    <button onclick="changeFreq()">SET</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
    <span style="font-size: 10px; color: #888;">RIWAYAT CHAT:</span>
    <div style="display: flex; gap: 4px;">
      <button onclick="openFullscreenChat()" style="font-size: 9px; padding: 2px 6px; background: #181818; color: #60a5fa !important; border: 1px solid #333;">⛶ FULLSCREEN</button>
      <button onclick="openClearModal()" style="font-size: 9px; padding: 2px 6px; background: #181818; color: #ef4444 !important; border: 1px solid #333;">HAPUS CHAT</button>
    </div>
  </div>

  <div class="chat-box" id="chatBox"></div>
  
  <div class="quick-btns">
    <button class="quick-btn" onclick="sendQuickText('Situasi')">8-1-9</button>
    <button class="quick-btn" onclick="sendQuickText('Di mengerti')">8-6</button>
    <button class="quick-btn" onclick="sendQuickText('Posisi')">10-2</button>
    <button class="quick-btn" onclick="sendQuickText('Terusan berita')">8-7</button>
  </div>

  <div class="input-group">
    <input type="text" id="msgInput" placeholder="Ketik pesan / tempel link..." onkeypress="handleKeyPress(event)">
    <button onclick="sendText()">KIRIM</button>
  </div>

  <button onclick="replayLastAudio()" id="replayBtn" style="width: 100%; margin-bottom: 10px; background: #181818; border: 1px solid #333; padding: 6px 12px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer;">
    <span class="white-icon">▶</span> REPLAY LAST AUDIO
  </button>

  <!-- PTT BUTTON DENGAN ICON MIC WHATSAPP -->
  <div class="ptt-container">
    <button class="ptt-btn" id="pttBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <span style="font-size: 10px;" id="pttLabel">PUSH TO TALK</span>
    </button>
    <button class="lock-btn" id="lockPttBtn" onclick="togglePttLock()">🔓 KUNCI PTT (HANDS-FREE)</button>
  </div>
  <div class="status" id="micStatus">Mikrofon Siap</div>
</div>

<div class="fullscreen-chat-overlay" id="fullscreenChat">
  <div class="fs-header">
    <div class="fs-header-title">
      <button onclick="closeFullscreenChat()" style="background:transparent; border:none; font-size:18px; padding:0; cursor:pointer;">←</button>
      <span>💬 Chat Frekuensi <span id="fsFreqTitle">145.820</span></span>
    </div>
    <button onclick="closeFullscreenChat()" style="font-size:11px; padding:5px 10px; border-radius:4px;">TUTUP</button>
  </div>

  <div class="fs-chat-body" id="fsChatBox"></div>

  <div class="fs-chat-footer">
    <button onclick="triggerCamera()" style="background:#0284c7; color:#fff !important; border:none; border-radius:50%; width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;">📷</button>
    <button onclick="triggerGallery()" style="background:#059669; color:#fff !important; border:none; border-radius:50%; width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;">🖼️</button>
    <input type="text" id="fsMsgInput" placeholder="Ketik pesan..." onkeypress="handleFsKeyPress(event)">
    <button onclick="sendFsText()">➤</button>
    
    <!-- MIC ICON WHATSAPP UNTUK FULLSCREEN CHAT -->
    <button class="fs-ptt-btn" id="fsPttBtn" title="Tahan untuk Rekam Suara">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>
</div>

<div id="cameraModal" class="modal-overlay">
  <div class="modal-box" style="max-width: 320px; padding: 12px; border-color: #0284c7;">
    <div style="color: #0284c7 !important; font-weight: bold; font-size: 13px; margin-bottom: 8px;">📷 AMBIL FOTO DIRECT</div>
    <video id="webcamVideo" autoplay playsinline style="width: 100%; border-radius: 8px; background: #000; height: 220px; object-fit: cover; border: 1px solid #333;"></video>
    <div class="modal-btns" style="margin-top: 10px;">
      <button class="modal-btn-cancel" onclick="closeDirectCamera()">BATAL</button>
      <button class="modal-btn-ok" style="background: #0284c7; border-color: #38bdf8;" onclick="takeDirectPhoto()">AMBIL & KIRIM</button>
    </div>
  </div>
</div>

<div id="customModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-text" id="modalText">Pemberitahuan</div>
    <div class="modal-btns" id="modalBtns">
      <button class="modal-btn-ok" onclick="closeModal()">OK</button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "wss://my-ht-project.ukielaki8387.workers.dev";

  function triggerGallery() {

  function handleGalleryUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        const maxDim = 800;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
        sendPhotoMessage(compressedBase64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  let localCamStream = null;

  async function triggerCamera() {
    initAudioContext();
    const modal = document.getElementById('cameraModal');

    try {
      localCamStream = await navigator.mediaDevices.getUserMedia({

      modal.style.display = 'flex';
    } catch (err) {
      try {
        localCamStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },

        modal.style.display = 'flex';

  function closeDirectCamera() {
    const modal = document.getElementById('cameraModal');
    modal.style.display = 'none';
    if (localCamStream) {
      localCamStream.getTracks().forEach(track => track.stop());
      localCamStream = null;
    }

  function takeDirectPhoto() {
    const video = document.getElementById('webcamVideo');
    const canvas = document.createElement('canvas');
    
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
    
    sendPhotoMessage(compressedBase64);

  function sendPhotoMessage(base64Image) {
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    if (ws && ws.readyState === WebSocket.OPEN) {
      const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);

  function setFcmToken(token) {
    if (!token) return;
    window.myFcmToken = token;
    console.log("Token FCM Diterima dari Native Android:", token);
    kirimTokenKeWorker(currentFreq);
  }
  window.setFcmToken = setFcmToken;

  function kirimTokenKeWorker(freq) {
    if (window.myFcmToken) {
      fetch(`${HTTP_WORKER_URL}/register-fcm`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          freq: freq,
          token: window.myFcmToken,
          callsign: localStorage.getItem('ht_nick') || "Anonim"
        })
      })
      .then(res => res.json())
      .then(data => console.log("Registrasi FCM ke Cloudflare Sukses:", data))
      .catch(err => console.error("Gagal kirim FCM token ke Cloudflare:", err));
    }
  }
  window.kirimTokenKeWorker = kirimTokenKeWorker;

  function initAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playNotificationSound() {
    try {
      initAudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } catch(e) {}
  }

  function showBannerNotification(sender, message) {
    playNotificationSound();

    if ("Notification" in window && Notification.permission === "granted") {
      try {
        let msgBody = message;
        if (message.includes("audio-vn-data")) msgBody = "🎙️ Pesan Suara (VN)";
        else if (message.includes("img-data:")) msgBody = "📷 Mengirimkan Foto";

        new Notification(`Pesan HT [${currentFreq}] dari ${sender}`, {
          body: msgBody,
          icon: 'logo.png',
          vibrate: [200, 100, 200]
        });
      } catch(e) {}
    }
  }
  window.showBannerNotification = showBannerNotification;

  function playSquelchNoise(duration = 0.15) {
    try {
      initAudioContext();
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      whiteNoise.connect(gain);
      gain.connect(audioCtx.destination);
      whiteNoise.start();
    } catch(e) {}
  }

  function playRogerBeep() {
    try {
      initAudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
      setTimeout(() => playSquelchNoise(0.1), 80);
    } catch(e) {}
  }

  function toggleScan() {
    initAudioContext();
    isScanning = !isScanning;
    const scanBtn = document.getElementById('scanBtn');
    const scanStatus = document.getElementById('scanStatus');

    if (isScanning) {
      scanBtn.innerHTML = '<span class="white-icon">⏹</span> STOP';

      clearInterval(scanInterval);
      scanBtn.innerHTML = '<span class="white-icon">🔍</span> SCAN';
      scanStatus.innerText = "SCAN: OFF";

  function speakText(text) {

  window.addEventListener('DOMContentLoaded', () => {
    setInterval(() => {
      const bars = ["SIG: ▂", "SIG: ▂▄", "SIG: ▂▄▆", "SIG: ▂▄▆█"];

  }

  function confirmCreateGroup() {

    const name = document.getElementById('newGroupName').value.trim();
    const freq = document.getElementById('newGroupFreq').value.trim();
    const pass = document.getElementById('newGroupPass').value.trim();

      showAlert("Nama dan ID/Frekuensi Grup wajib diisi!");

  function switchGroupFromDropdown() {

    const val = document.getElementById('groupSelect').value;

    const pass = parts[1] || '';

    document.getElementById('freqInput').value = freq;
    document.getElementById('passInput').value = pass;
    joinFrequency(freq, pass);
  }

  function connect() {
    ws = new WebSocket(WORKER_URL);
    ws.onopen = () => {
      const savedPass = localStorage.getItem('ht_pass') || '';
      const savedNick = localStorage.getItem('ht_nick') || 'Anonim';
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'join', freq: currentFreq, sender: savedNick, password: savedPass }));
        kirimTokenKeWorker(currentFreq);
      }
    };

    ws.onmessage = async (event) => {
      try {
        const data = JSON.parse(event.data);
        
        if (data.type === 'history') {
          if (data.messages && data.messages.length > 0) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = ''; 
            addSystemMsg(`Terhubung ke frekuensi ${currentFreq}`);
            renderedMsgIds.clear();
            
            // FILTER HISTORY BERDASARKAN PENANDA WAKTU HAPUS
            const clearTimestamp = parseInt(localStorage.getItem(`clear_time_${currentFreq}`) || "0", 10);
            const filteredMessages = data.messages.filter(msg => {
              let msgTime = 0;
              if (msg.msgId && msg.msgId.includes('_')) {
                msgTime = parseInt(msg.msgId.split('_')[0], 10) || 0;
              }
              return msgTime > clearTimestamp;
            });

            filteredMessages.forEach(msg => {
              if (msg.msgId) renderedMsgIds.add(msg.msgId);
              appendChatToBox(`[${msg.sender}]: ${msg.message}`);
            });
            
            localStorage.setItem(`local_chat_${currentFreq}`, JSON.stringify(filteredMessages));
          }
        }
        else if (data.type === 'join_success') {
          hideError();
          document.getElementById('freqDisplay').innerText = data.freq;
          document.getElementById('fsFreqTitle').innerText = data.freq;
          document.getElementById('privateBadge').innerText = (PRIVATE_CHANNELS[data.freq] || (localStorage.getItem('ht_pass') !== '')) ? "🔒 PRIVATE CHANNEL / GRUP" : "";
        }
        else if (data.type === 'presence') {
          const uniqueUsers = [...new Set((data.users || []).filter(u => u && u.trim() !== ''))];
          document.getElementById('onlineCount').innerText = uniqueUsers.length;
          document.getElementById('namesList').innerText = uniqueUsers.length > 0 ? uniqueUsers.join(', ') : '-';
        } 
        else if (data.type === 'text') {
          if (data.msgId && renderedMsgIds.has(data.msgId)) {
            return;
          }

          if (data.msgId) {
            renderedMsgIds.add(data.msgId);
          }

          const myNick = document.getElementById('nickInput').value.trim() || 'Anonim';
          
          if (data.sender !== myNick) {
            showBannerNotification(data.sender, data.message);
            playRogerBeep();
            if(!data.message.includes("audio-vn-data") && !data.message.includes("img-data:")) {
              speakText(`${data.sender} berkata ${data.message}`);
            }
          }

          saveAndAddSingleChat(data.msgId, data.sender, data.message);
        } 
        else if (data.type === 'audio') {
          lastAudioData = data.audio;
          playAudio(data.audio);
        }
      } catch (e) {}
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }

  function replayLastAudio() {
    initAudioContext();
    if (lastAudioData) {
      playAudio(lastAudioData);
    } else {
      showAlert("Tidak ada audio tersimpan.");
    }
  }

  function toggleRadio() {
    initAudioContext();
    const player = document.getElementById('radioPlayer');
    const btn = document.getElementById('radioBtn');
    const select = document.getElementById('radioSelect');
    if (!isRadioPlaying) {
      player.src = select.value;
      player.volume = customRadioVolume;
      player.play().catch(() => {
        showAlert("Gagal memutar Radio.");
        btn.innerText = "PLAY";
        btn.style.background = "#222";
        isRadioPlaying = false;
      });
      btn.innerText = "STOP";
      btn.style.background = "#b91c1c";
      isRadioPlaying = true;
    } else {
      player.pause();
      player.src = "";
      btn.innerText = "PLAY";
      btn.style.background = "#222";
      isRadioPlaying = false;
    }

  function changeRadioChannel() {
    const player = document.getElementById('radioPlayer');
    const select = document.getElementById('radioSelect');

      player.pause();
      player.src = select.value;
      player.load();
      player.play().catch(() => {});
    }
  }

  function adjustRadioVolume(val) {
    customRadioVolume = parseFloat(val);
    restoreRadioVolume();
  }

  function duckRadioVolume() {
    const player = document.getElementById('radioPlayer');
    if (isRadioPlaying) player.volume = customRadioVolume * 0.1;
  }

  function restoreRadioVolume() {
    const player = document.getElementById('radioPlayer');
    if (isRadioPlaying) player.volume = customRadioVolume;
  }

  function joinFrequency(freq, password = '') {
    if (PRIVATE_CHANNELS[freq]) {
      const correctPass = PRIVATE_CHANNELS[freq];
      if (password !== correctPass) {
        showError("🔒 Frekuensi Private! Password Salah.");
        return;
      }
    }
    currentFreq = freq;
    window.currentFreq = currentFreq;
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    localStorage.setItem('ht_nick', nick);
    localStorage.setItem('ht_freq', freq);
    localStorage.setItem('ht_pass', password);
    loadLocalHistory(freq);
    
    kirimTokenKeWorker(freq);

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'join', freq: freq, sender: nick, password: password }));
    }
  }

  function changeFreq() {
    initAudioContext();
    if (isScanning) toggleScan();
    const newFreq = document.getElementById('freqInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if (newFreq) joinFrequency(newFreq, pass);
  }

  function sendText() {
    initAudioContext();
    const input = document.getElementById('msgInput');
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    const msgText = input.value.trim();
    
    if (msgText && ws && ws.readyState === WebSocket.OPEN) {
      const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      
      ws.send(JSON.stringify({ 
        type: 'text', 
        freq: currentFreq, 
        sender: nick, 
        message: msgText,
        msgId: msgId
      }));

      input.value = '';
    }
  }

  function sendQuickText(text) {
    initAudioContext();
    document.getElementById('msgInput').value = text;
    sendText();
  }

  function sendGPSLocation() {
    initAudioContext();
    if (!navigator.geolocation) {
      showAlert("Fitur GPS tidak didukung pada browser/perangkat ini.");
      return;
    }

    addSystemMsg("Mencari koordinat GPS...");

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude.toFixed(5);
        const lon = position.coords.longitude.toFixed(5);
        const mapUrl = `https://maps.google.com/?q=${lat},${lon}`;
        const gpsMsg = `📍 POSISI GPS: ${mapUrl}`;

        const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
        if (ws && ws.readyState === WebSocket.OPEN) {
          const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
          ws.send(JSON.stringify({
            type: 'text',
            freq: currentFreq,
            sender: nick,
            message: gpsMsg,
            msgId: msgId
          }));
        }
      },
      (error) => {
        let errDesc = "Gagal mengambil lokasi.";
        if (error.code === error.PERMISSION_DENIED) errDesc = "Izin akses lokasi/GPS ditolak.";
        else if (error.code === error.POSITION_UNAVAILABLE) errDesc = "Sinyal GPS tidak tersedia.";
        else if (error.code === error.TIMEOUT) errDesc = "Waktu permintaan GPS habis.";
        showAlert(errDesc);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendText();
  }

  function saveAndAddSingleChat(msgId, sender, message) {
    appendChatToBox(`[${sender}]: ${message}`);
    
    let localMsgs = JSON.parse(localStorage.getItem(`local_chat_${currentFreq}`)) || [];
    const alreadySaved = localMsgs.some(m => m.msgId === msgId);
    if (!alreadySaved) {
      localMsgs.push({ msgId, sender, message });
      if (localMsgs.length > 30) localMsgs.shift();
      localStorage.setItem(`local_chat_${currentFreq}`, JSON.stringify(localMsgs));
    }
  }

  function loadLocalHistory(freq) {
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '';
    addSystemMsg(`Frekuensi: ${freq}`);
    renderedMsgIds.clear();

    const clearTimestamp = parseInt(localStorage.getItem(`clear_time_${freq}`) || "0", 10);
    const localMsgs = JSON.parse(localStorage.getItem(`local_chat_${freq}`)) || [];
    
    localMsgs.forEach(msg => {
      let msgTime = 0;
      if (msg.msgId && msg.msgId.includes('_')) {
        msgTime = parseInt(msg.msgId.split('_')[0], 10) || 0;
      }
      
      if (msgTime > clearTimestamp) {
        if (msg.msgId) renderedMsgIds.add(msg.msgId);
        appendChatToBox(`[${msg.sender}]: ${msg.message}`);
      }
    });
  }

  function showAlert(msg) {
    document.getElementById('modalText').innerText = msg;
    document.getElementById('modalBtns').innerHTML = `<button class="modal-btn-ok" onclick="closeModal()">OK</button>`;
    document.getElementById('customModal').style.display = 'flex';
  }

  function openClearModal() {
    initAudioContext();
    document.getElementById('modalText').innerText = `Yakin ingin menghapus riwayat chat di frekuensi ${currentFreq}?`;
    document.getElementById('modalBtns').innerHTML = `
      <button class="modal-btn-cancel" onclick="closeModal()">BATAL</button>
      <button class="modal-btn-ok" onclick="confirmClearChat()">HAPUS</button>
    `;
    document.getElementById('customModal').style.display = 'flex';
  }

  function closeModal() { document.getElementById('customModal').style.display = 'none'; }

  function confirmClearChat() {
    const chatBox = document.getElementById('chatBox');
    const fsBox = document.getElementById('fsChatBox');
    
    chatBox.innerHTML = '';
    if (fsBox) fsBox.innerHTML = '';
    
    renderedMsgIds.clear();
    localStorage.removeItem(`local_chat_${currentFreq}`);
    
    // PENANDA WAKTU PENGHAPUSAN CHAT
    localStorage.setItem(`clear_time_${currentFreq}`, Date.now().toString());

    addSystemMsg(`Riwayat chat frekuensi ${currentFreq} telah dibersihkan.`);
    closeModal();
  }

  function playVNFromData(base64Data) {
    playAudio(base64Data);
  }
  window.playVNFromData = playVNFromData;

  function appendChatToBox(msg) {
    const box = document.getElementById('chatBox');
    const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    
    let formattedMsg = msg;
    
    if (msg.includes("audio-vn-data:")) {
      const parts = msg.split("audio-vn-data:");
      const senderInfo = parts[0]; 
      const audioBase64 = parts[1];
      
      formattedMsg = `${senderInfo}<br>
        <div class="vn-player-bubble">
          <button class="vn-play-btn" onclick="playVNFromData('${audioBase64}')">▶</button>
          <span class="vn-label">🎙️ Voice Note</span>
        </div>`;
    } 
    else if (msg.includes("img-data:")) {
      const parts = msg.split("img-data:");
      const senderInfo = parts[0];
      const imgBase64 = parts[1];

      formattedMsg = `${senderInfo}<br>
        <a href="${imgBase64}" target="_blank">
          <img src="${imgBase64}" class="chat-img-thumb" alt="Foto Kiriman">
        </a>`;
    } 
    else {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      formattedMsg = msg.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    const content = `<div><span class="time-stamp">[${time}]</span>${formattedMsg}</div>`;
    box.innerHTML += content;
    box.scrollTop = box.scrollHeight;

    const fsBox = document.getElementById('fsChatBox');
    if (fsBox) {
      fsBox.innerHTML += content;
      fsBox.scrollTop = fsBox.scrollHeight;
    }
  }

  function addSystemMsg(msg) { appendChatToBox(`[SYS] ${msg}`); }

  function openFullscreenChat() {
    initAudioContext();
    document.getElementById('fsFreqTitle').innerText = currentFreq;
    const fsBox = document.getElementById('fsChatBox');
    const chatBox = document.getElementById('chatBox');
    
    fsBox.innerHTML = chatBox.innerHTML;
    document.getElementById('fullscreenChat').classList.add('active');
    fsBox.scrollTop = fsBox.scrollHeight;
  }

  function closeFullscreenChat() {
    document.getElementById('fullscreenChat').classList.remove('active');
  }

  function sendFsText() {
    initAudioContext();
    const input = document.getElementById('fsMsgInput');
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    const msgText = input.value.trim();
    
    if (msgText && ws && ws.readyState === WebSocket.OPEN) {
      const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      
      ws.send(JSON.stringify({ 
        type: 'text', 
        freq: currentFreq, 
        sender: nick, 
        message: msgText,
        msgId: msgId
      }));

      input.value = '';
    }
  }

  function handleFsKeyPress(e) {
    if (e.key === 'Enter') sendFsText();
  }

  async function startRecordingAudio(source = 'main') {
    initAudioContext();
    activePttSource = source;
    if (mediaRecorder && mediaRecorder.state === "recording") return;

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });

      audioChunks = [];
      mediaRecorder = new MediaRecorder(micStream);

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        audioChunks = [];
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          const base64Audio = reader.result;
          const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
          
          if (ws && ws.readyState === WebSocket.OPEN) {
            if (activePttSource === 'fullscreen') {
              const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
              const vnPayload = `audio-vn-data:${base64Audio}`;
              ws.send(JSON.stringify({
                type: 'text',
                freq: currentFreq,
                sender: nick,
                message: vnPayload,
                msgId: msgId
              }));
            } else {
              ws.send(JSON.stringify({ type: 'audio', freq: currentFreq, audio: base64Audio }));
            }
          }
        };

        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
      };

      playSquelchNoise(0.1);
      duckRadioVolume();
      mediaRecorder.start();
      document.getElementById('micStatus').innerText = "🎙️ MEREKAM (TRANSMIT)...";
    } catch (err) {
      document.getElementById('micStatus').innerText = "Akses mikrofon ditolak/gagal";
      if (isPttLocked) togglePttLock(); 
    }
  }

  function stopRecordingAudio() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      playRogerBeep();
      document.getElementById('micStatus').innerText = "Mikrofon Siap";
      restoreRadioVolume();
    }
  }

  function setupPTT() {
    const pttBtn = document.getElementById('pttBtn');
    const fsPttBtn = document.getElementById('fsPttBtn');

    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if (!isPttLocked) startRecordingAudio('main'); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); if (!isPttLocked) stopRecordingAudio(); });
    pttBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); if (!isPttLocked) stopRecordingAudio(); });
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isPttLocked) startRecordingAudio('main'); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); if (!isPttLocked) stopRecordingAudio(); });

    if (fsPttBtn) {
      fsPttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecordingAudio('fullscreen'); });
      fsPttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopRecordingAudio(); });
      fsPttBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); stopRecordingAudio(); });
      fsPttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecordingAudio('fullscreen'); });
      fsPttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecordingAudio(); });
    }
  }

  function togglePttLock() {
    initAudioContext();
    const pttBtn = document.getElementById('pttBtn');
    const lockBtn = document.getElementById('lockPttBtn');
    const pttLabel = document.getElementById('pttLabel');

    isPttLocked = !isPttLocked;

    if (isPttLocked) {
      pttBtn.classList.add('locked');
      if (pttLabel) pttLabel.innerText = "LOCK ON";
      lockBtn.innerText = "🔒 BUKA KUNCI PTT";
      lockBtn.style.background = "#ef4444";
      lockBtn.style.color = "#fff";
      startRecordingAudio('main');
    } else {
      pttBtn.classList.remove('locked');
      if (pttLabel) pttLabel.innerText = "PUSH TO TALK";
      lockBtn.innerText = "🔓 KUNCI PTT (HANDS-FREE)";
      lockBtn.style.background = "#181818";
      lockBtn.style.color = "#f59e0b";
      stopRecordingAudio();
    }
  }

  function playAudio(base64Data) {
    initAudioContext();
    playSquelchNoise(0.1);
    duckRadioVolume();

    const audio = new Audio(base64Data);
    audio.play();

    audio.onended = () => {
      playRogerBeep();
      restoreRadioVolume();
    };

    audio.onerror = () => {
      restoreRadioVolume();
    };
  }

  function showError(msg) {
    const alert = document.getElementById('errorAlert');
    alert.innerText = msg;
    alert.style.display = 'block';
  }

  function hideError() {
    const alert = document.getElementById('errorAlert');
    alert.style.display = 'none';
  }

  function openCompassModal() {
    initAudioContext();
    if (typeof DeviceOrientationEvent === 'undefined') {
      alert("Sensor tidak didukung pada browser/perangkat ini.");
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handlePopupCompass);
            document.getElementById('compassModal').style.display = 'flex';
          } else {
            alert("Izin sensor ditolak.");
          }
        })
        .catch(err => alert("Gagal mendapatkan izin kompas: " + err));
    } else {
      window.addEventListener('deviceorientation', handlePopupCompass);
      document.getElementById('compassModal').style.display = 'flex';
    }
  }

  function closeCompassModal() {
    window.removeEventListener('deviceorientation', handlePopupCompass);
    document.getElementById('compassModal').style.display = 'none';
  }

  function handlePopupCompass(event) {
    let heading = 0;
    if (event.webkitCompassHeading !== undefined) {
      heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
      heading = 360 - event.alpha;
    }

    const degrees = Math.round(heading);
    const directions = ['UTARA', 'TIMUR LAUT', 'TIMUR', 'TENGGARA', 'SELATAN', 'BARAT DAYA', 'BARAT', 'BARAT LAUT'];
    const index = Math.round(degrees / 45) % 8;

    document.getElementById('popupCompassDeg').innerText = degrees + '°';
    document.getElementById('popupCompassDir').innerText = directions[index];

    const dial = document.getElementById('compassDial');
    if (dial) {
      dial.style.transform = `rotate(${-degrees}deg)`;
    }
  }
</script>
