<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MRZYB-HT BLACK EDITION</title>
  <style>
    /* --- SYSTEM VARIABLES FOR THEMES --- */
    :root {
      --bg-main: #000000;
      --ht-bg: #121212;
      --ht-border: #ffffff;
      --ht-neon: #a3e635;
      --text-color: #a3e635;
      --screen-bg: #050505;
      --screen-border: #ffffff;
      --panel-bg: #080808;
      --btn-bg: #222222;
      --btn-border: #ffffff;
      --slider-thumb: #a3e635;
      
      --fs-bg: #0b141a;
      --fs-bg-pattern: #182229;
      --fs-header-bg: #1f2c34;
      --fs-header-border: #ffffff;
      --fs-text: #ffffff;
      --fs-accent: #a3e635;
      --fs-input-bg: #2a3942;
      --fs-bubble-bg: #1f2c34;
      --fs-bubble-border: #ffffff;
      --wa-green: #00a884;
    }

    .theme-green { 
      --ht-bg: #1b2612; 
      --ht-border: #ffffff; 
      --ht-neon: #4ade80; 
      --text-color: #86efac;
      --screen-bg: #1a3300;
      --screen-border: #ffffff;
      --panel-bg: #142900;
      --btn-bg: #142900;
      --btn-border: #ffffff;
      --slider-thumb: #86efac;

      --fs-bg: #0c1a09;
      --fs-bg-pattern: #132b10;
      --fs-header-bg: #163312;
      --fs-header-border: #ffffff;
      --fs-text: #ffffff;
      --fs-accent: #4ade80;
      --fs-input-bg: #1f421a;
      --fs-bubble-bg: #163312;
      --fs-bubble-border: #ffffff;
      --wa-green: #22c55e;
    }

    .theme-pink { 
      --ht-bg: #2a0818; 
      --ht-border: #ffffff; 
      --ht-neon: #f472b6; 
      --text-color: #f472b6;
      --screen-bg: #3b0724;
      --screen-border: #ffffff;
      --panel-bg: #1f0412;
      --btn-bg: #4c052e;
      --btn-border: #ffffff;
      --slider-thumb: #f472b6;

      --fs-bg: #1a0410;
      --fs-bg-pattern: #2b081c;
      --fs-header-bg: #380b25;
      --fs-header-border: #ffffff;
      --fs-text: #ffffff;
      --fs-accent: #f472b6;
      --fs-input-bg: #4d1033;
      --fs-bubble-bg: #380b25;
      --fs-bubble-border: #ffffff;
      --wa-green: #ec4899;
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    body { 
      background-color: var(--bg-main); 
      color: var(--text-color); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      min-height: 100dvh;
      padding: 10px;
    }
    
    .ht-body { 
      background: var(--ht-bg); 
      border: 3px solid #ffffff; 
      border-radius: 20px; 
      padding: 15px; 
      width: 100%; 
      max-width: 420px; 
      max-height: 96vh;
      max-height: 96dvh;
      overflow-y: auto;
      box-shadow: 0 0 15px var(--ht-neon), inset 0 0 10px var(--ht-neon); 
      position: relative; 
      transition: all 0.3s; 
    }

    .ht-body::-webkit-scrollbar {
      width: 4px;
    }
    .ht-body::-webkit-scrollbar-thumb {
      background: #ffffff;
      border-radius: 4px;
    }

    .ptt-container { text-align: center; margin-top: 10px; }
    .ptt-btn { 
      background: var(--wa-green) !important; 
      color: #ffffff !important; 
      border: 2px solid #ffffff !important;
      border-radius: 50% !important;
      width: 85px; 
      height: 85px; 
      margin: 0 auto; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: bold; 
      font-family: inherit; 
      cursor: pointer; 
      user-select: none; 
      touch-action: manipulation;
      box-shadow: 0 0 12px var(--ht-neon) !important;
      transition: all 0.2s;
    }
    .ptt-btn:active {
      transform: scale(1.08);
      background: #b91c1c !important;
      box-shadow: 0 0 20px rgba(185, 28, 28, 0.8) !important;
    }
    .ptt-btn svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
    
    .ptt-btn.locked {
      background: #ef4444 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8) !important;
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .lock-btn {
      margin-top: 8px;
      font-size: 10px;
      padding: 6px 10px;
      background: #181818;
      color: #f59e0b !important;
      border: 1px solid #ffffff;
      box-shadow: 0 0 5px var(--ht-neon);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .screen { 
      background: var(--screen-bg); 
      border: 2px solid #ffffff; 
      box-shadow: 0 0 8px var(--ht-neon);
      padding: 10px; 
      border-radius: 8px; 
      margin-bottom: 10px; 
      text-align: center; 
      position: relative; 
      color: var(--text-color); 
    }
    .status-bar { display: flex; justify-content: space-between; font-size: 9px; color: #aaa; margin-bottom: 4px; }
    .signal-meter { font-weight: bold; letter-spacing: 1px; }
    .freq { font-size: 24px; font-weight: bold; line-height: 1.1; word-break: break-all; }

    .user-list { 
      border: 1px solid #ffffff; 
      box-shadow: 0 0 6px var(--ht-neon);
      background: var(--panel-bg); 
      padding: 8px; 
      border-radius: 5px; 
      margin-bottom: 10px; 
      font-size: 11px; 
      color: var(--text-color); 
    }
    .user-count { font-weight: bold; }
    .user-names { color: #aaa; font-size: 10px; margin-top: 4px; word-break: break-all; }

    .chat-box, 
    .fs-chat-body,
    #msgInput,
    #fsMsgInput { 
      color: #ffffff !important; 
      font-size: 14.5px !important; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      line-height: 1.4;
    }

    .chat-box div, 
    .fs-chat-body div {
      color: #ffffff !important;
    }

    .chat-box { 
      background: var(--screen-bg); 
      height: 16vh;
      min-height: 90px;
      max-height: 160px;
      overflow-y: auto; 
      border: 1px solid #ffffff; 
      box-shadow: inset 0 0 6px var(--ht-neon);
      padding: 8px; 
      margin-bottom: 8px; 
      border-radius: 5px; 
      word-wrap: break-word; 
    }
    .chat-box a, .fs-chat-body a { color: #38bdf8 !important; text-decoration: underline; font-weight: bold; word-break: break-all; }
    .chat-img-thumb { max-width: 100%; max-height: 120px; border-radius: 5px; border: 1px solid #ffffff; margin-top: 4px; cursor: pointer; display: block; transition: transform 0.2s; }
    .chat-img-thumb:hover { transform: scale(1.02); }
    
    .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
    input, select { 
      flex: 1; 
      background: var(--screen-bg); 
      border: 1px solid #ffffff; 
      box-shadow: 0 0 4px var(--ht-neon);
      color: #ffffff !important; 
      padding: 8px; 
      border-radius: 3px; 
      font-size: 13px; 
    }
    button { 
      background: var(--btn-bg); 
      color: var(--text-color); 
      border: 1px solid #ffffff; 
      box-shadow: 0 0 5px var(--ht-neon);
      padding: 8px 12px; 
      cursor: pointer; 
      border-radius: 3px; 
      transition: all 0.2s;
    }
    
    .error-msg { color: #ef4444 !important; font-size: 11px; text-align: center; margin-bottom: 10px; display: none; }
    .status { text-align: center; font-size: 11px; margin-top: 5px; color: #aaa; }
    .private-badge { font-size: 10px; color: #f59e0b !important; margin-top: 2px; }
    .radio-panel { 
      border: 1px dashed #ffffff; 
      box-shadow: 0 0 6px var(--ht-neon);
      padding: 8px; 
      border-radius: 5px; 
      margin-bottom: 10px; 
      background: var(--panel-bg); 
      color: var(--text-color); 
    }
    .time-stamp { color: #8696a0 !important; font-size: 11px !important; margin-right: 5px; }

    .extra-tools { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 4px; 
      margin-bottom: 10px; 
      font-size: 10px; 
      background: var(--panel-bg); 
      padding: 6px; 
      border-radius: 5px; 
      border: 1px solid #ffffff; 
      box-shadow: 0 0 6px var(--ht-neon);
      color: var(--text-color); 
    }
    .extra-tools button { padding: 5px 2px; font-size: 9px; text-align: center; }

    .white-icon { filter: brightness(0) invert(1); display: inline-block; vertical-align: middle; margin-right: 2px; }
    
    .modern-slider { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
    .modern-slider::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #222; border-radius: 5px; border: 1px solid #ffffff; }
    .modern-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--slider-thumb); margin-top: -5px; box-shadow: 0 0 8px var(--ht-neon); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { 
      background: var(--ht-bg); 
      border: 2px solid #ffffff; 
      box-shadow: 0 0 20px var(--ht-neon);
      padding: 20px; 
      border-radius: 10px; 
      width: 85%; 
      max-width: 300px; 
      text-align: center; 
      position: relative; 
    }
    .modal-text { color: #ccc !important; font-size: 12px; margin-bottom: 15px; line-height: 1.4; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btn-ok { background: #b91c1c; color: #fff !important; border: 1px solid #ffffff; padding: 6px 15px; font-size: 11px; cursor: pointer; }
    .modal-btn-cancel { background: #222; color: #888 !important; border: 1px solid #ffffff; padding: 6px 15px; font-size: 11px; cursor: pointer; }

    .close-x-btn { position: absolute; top: 8px; right: 12px; background: transparent; border: none; color: #ef4444 !important; font-size: 18px; font-weight: bold; cursor: pointer; padding: 0; }
    .compass-circle-outer { width: 130px; height: 130px; border: 3px solid #f59e0b; border-radius: 50%; margin: 10px auto; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
    .compass-dial { position: absolute; width: 100%; height: 100%; border-radius: 50%; transition: transform 0.1s ease-out; }
    .compass-mark-u { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); color: #ef4444 !important; font-weight: bold; font-size: 12px; }
    .compass-mark-s { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); color: #fff !important; font-size: 10px; }
    .compass-mark-t { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); color: #fff !important; font-size: 10px; }
    .compass-mark-b { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: #fff !important; font-size: 10px; }
    .compass-pointer { width: 4px; height: 45px; background: linear-gradient(to bottom, #ef4444 50%, #ffffff 50%); position: absolute; border-radius: 2px; }

    .fullscreen-chat-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--fs-bg);
      z-index: 9999;
      flex-direction: column;
      transition: background 0.3s;
    }
    
    .fullscreen-chat-overlay.active { display: flex; }
    .fs-header { background: var(--fs-header-bg); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ffffff; color: #ffffff; }
    .fs-header-title { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 8px; color: #ffffff !important; }
    .fs-header-title span { color: var(--fs-accent) !important; }
    .fs-chat-body { flex: 1; padding: 15px; overflow-y: auto; background-color: var(--fs-bg); background-image: radial-gradient(var(--fs-bg-pattern) 1px, transparent 1px); background-size: 16px 16px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .fs-chat-footer { background: var(--fs-header-bg); padding: 10px 12px; display: flex; gap: 6px; align-items: center; border-top: 1px solid #ffffff; }
    .fs-chat-footer input { background: var(--fs-input-bg); border: 1px solid #ffffff; padding: 10px 12px; border-radius: 20px; outline: none; }
    .fs-chat-footer button { background: var(--fs-accent); color: #000 !important; border: 1px solid #ffffff; border-radius: 50%; width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; font-weight: bold; box-shadow: 0 0 8px var(--ht-neon); }
    
    .fs-ptt-btn { 
      background: var(--wa-green) !important; 
      color: #fff !important; 
      border: 1px solid #ffffff; 
      border-radius: 50%; 
      width: 38px; 
      height: 38px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      user-select: none; 
      touch-action: manipulation; 
      box-shadow: 0 0 8px var(--ht-neon); 
      transition: all 0.2s; 
    }
    .fs-ptt-btn:active { background: #b91c1c !important; transform: scale(1.15); }
    .fs-ptt-btn svg { width: 20px; height: 20px; fill: #ffffff; }

    .vn-player-bubble { display: inline-flex; align-items: center; gap: 8px; background: var(--fs-bubble-bg); border: 1px solid #ffffff; padding: 4px 10px; border-radius: 12px; margin-top: 4px; margin-bottom: 2px; }
    .vn-play-btn { background: var(--fs-accent) !important; color: #000 !important; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-weight: bold; }
    .vn-label { font-size: 10px; color: var(--fs-accent) !important; font-weight: bold; }

    #imagePreviewModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
  </style>
</head>
<body>

<input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleGalleryUpload(event)">

<div class="ht-body" id="htContainer">
  <div style="text-align: center; margin-bottom: 8px;">
    <img src="logo.png" alt="Logo" style="width: 45px; height: 45px; border-radius: 50%; border: 1px solid #ffffff;" onerror="this.style.display='none'">
  </div>

  <h2 style="text-align: center; margin-top: 0; font-size: 16px; letter-spacing: 2px; margin-bottom: 10px; color: var(--text-color);">MRZYB-HT</h2>

  <div class="screen">
    <div class="status-bar">
      <span class="signal-meter" id="rssiMeter">SIG: ▂▄▆█</span>
      <span id="batDisplay">BAT: --% 🔋</span>
    </div>
    <div class="freq" id="freqDisplay">888.888</div>
    <div id="privateBadge" class="private-badge"></div>
  </div>

  <div class="extra-tools">
    <button onclick="triggerCamera()" style="background: #0284c7; color: #fff !important;">📷 FOTO</button>
    <button onclick="triggerGallery()" style="background: #059669; color: #fff !important;">🖼️ GALERI</button>
    <button onclick="openCompassModal()">🧭 KOMPAS</button>
    <button onclick="openMoviePlayer()" style="background: #7c3aed; color: #fff !important;">🎬 NONTON</button>
    <button onclick="sendGPSLocation()">📍 GPS</button>
    <button onclick="toggleTheme()" style="grid-column: span 1;">🎨 TEMA</button>
  </div>

  <div class="radio-panel">
    <div style="font-size: 9px; color: #aaa; margin-bottom: 4px; text-align: center;">📻 MONITORING RADIO FM</div>
    <div class="input-group" style="margin-bottom: 4px;">
      <select id="radioSelect" onchange="changeRadioChannel()">
        <option value="https://n08.radiojar.com/7csmg90fuqruv.mp3?1673348819=&rj-tok=AAABhZtmUCUAwkYyBBgriH-X9g&rj-ttl=5">HardRock</option>
        <option value="https://n0a.radiojar.com/4ywdgup3bnzuv?1673348637=&rj-tok=AAABhZtjYesAbqf2VnMskbfVxQ&rj-ttl=5">Iswara</option>
        <option value="https://stream.denger.in/">Dmi</option>
        <option value="https://stream.rcs.revma.com/ugpyzu9n5k3vv">Musik Indonesia</option>
      </select>
      <button id="radioBtn" onclick="toggleRadio()" style="padding: 4px 10px; font-size: 11px;">PLAY</button>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; font-size: 9px; color: #aaa;">
      <span>VOL:</span>
      <input type="range" id="radioVol" class="modern-slider" min="0" max="1" step="0.05" value="0.8" oninput="adjustRadioVolume(this.value)">
    </div>
  </div>
  <audio id="radioPlayer" crossorigin="anonymous"></audio>

  <div id="errorAlert" class="error-msg"></div>

  <div class="user-list">
    <span>Online: </span><span class="user-count" id="onlineCount">0</span>
    <div class="user-names" id="namesList">Belum ada user</div>
  </div>

  <div class="input-group">
    <input type="text" id="nickInput" placeholder="Callsign/Nama...">
  </div>

  <div class="input-group">
    <select id="groupSelect" onchange="switchGroupFromDropdown()">
      <option value="888.888||031283">📻 mrzyb aplikasi (888.888)</option>
      <option value="111.111||150307">📻 mrzyb family (111.111)</option>
      <option value="999.999||230887">📻 mrzyb random (999.999)</option>
    </select>
    <button onclick="openCreateGroupModal()" style="font-size: 10px; background: #065f46; color: #fff !important;">➕ GRUP</button>
  </div>

  <div class="input-group">
    <input type="text" id="freqInput" placeholder="Freq/Grup ID (888.888)">
  </div>
  <div class="input-group">
    <input type="password" id="passInput" placeholder="Password Private (opsional)">
    <button onclick="changeFreq()">SET</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
    <span style="font-size: 10px; color: #aaa;">RIWAYAT CHAT:</span>
    <div style="display: flex; gap: 4px;">
      <button onclick="openFullscreenChat()" style="font-size: 9px; padding: 2px 6px; background: #181818; color: #60a5fa !important;">⛶ FULLSCREEN</button>
      <button onclick="openClearModal()" style="font-size: 9px; padding: 2px 6px; background: #181818; color: #ef4444 !important;">HAPUS CHAT</button>
    </div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-group">
    <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
    <button onclick="sendText()">KIRIM</button>
  </div>

  <div class="ptt-container">
    <button class="ptt-btn" id="pttBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <span style="font-size: 9px;" id="pttLabel">PUSH TO TALK</span>
    </button>
    <button class="lock-btn" id="lockPttBtn" onclick="togglePttLock()">🔓 KUNCI PTT (HANDS-FREE)</button>
  </div>
  <div class="status" id="micStatus">Mikrofon Siap</div>
</div>

<!-- FULLSCREEN CHAT OVERLAY -->
<div class="fullscreen-chat-overlay" id="fullscreenChat">
  <div class="fs-header">
    <div class="fs-header-title">
      <button onclick="closeFullscreenChat()" style="background:transparent; border:none; font-size:18px; padding:0; cursor:pointer; color:#fff;">←</button>
      <span>💬 Chat Frekuensi <span id="fsFreqTitle">888.888</span></span>
    </div>
    <button onclick="closeFullscreenChat()" style="font-size:11px; padding:5px 10px; border-radius:4px;">TUTUP</button>
  </div>

  <div class="fs-chat-body" id="fsChatBox"></div>

  <div class="fs-chat-footer">
    <button onclick="triggerCamera()" style="background:#0284c7; color:#fff !important; border-radius:50%; width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;">📷</button>
    <button onclick="triggerGallery()" style="background:#059669; color:#fff !important; border-radius:50%; width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;">🖼️</button>
    <input type="text" id="fsMsgInput" placeholder="Ketik pesan..." onkeypress="handleFsKeyPress(event)">
    <button onclick="sendFsText()">➤</button>
    
    <button class="fs-ptt-btn" id="fsPttBtn" title="Tahan untuk Rekam Suara">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>
</div>

<!-- MODAL POPUP MOVIE PLAYER -->
<div id="movieModal" class="modal-overlay">

<script>
  // --- UTILITY SANITIZER UNTUK KEAMANAN XSS ---
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // --- INDEXEDDB ENGINE ---
  const DB_NAME = 'MRZYB_HT_DB';
  const DB_VERSION = 1;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        
        if (!db.objectStoreNames.contains('chats')) {
          const chatStore = db.createObjectStore('chats', { keyPath: 'id' });
          chatStore.createIndex('freq', 'freq', { unique: false });
        }

        if (!db.objectStoreNames.contains('groups')) {
          db.createObjectStore('groups', { keyPath: 'freq' });
        }
      };

      request.onsuccess = (e) => resolve(e.target.result);
      request.onerror = (e) => reject(e.target.error);
    });
  }

  async function dbSaveMessage(freq, msgData) {
    try {
      const db = await openDB();
      const tx = db.transaction('chats', 'readwrite');
      const store = tx.objectStore('chats');
      store.put({
        id: `${freq}_${msgData.msgId}`,
        freq: freq,
        msgId: msgData.msgId,
        sender: msgData.sender,
        message: msgData.message,
        timestamp: Date.now()
      });
    } catch (e) {
      console.error("IndexedDB Save Error:", e);
    }
  }

  async function dbGetChatHistory(freq) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readonly');
        const store = tx.objectStore('chats');
        const index = store.index('freq');
        const request = index.getAll(freq);

        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    } catch (e) {
      console.error("IndexedDB Fetch Error:", e);
      return [];
    }
  }

  async function dbClearChatHistory(freq) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readwrite');
        const store = tx.objectStore('chats');
        const index = store.index('freq');
        const request = index.openCursor(IDBKeyRange.only(freq));

        request.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            store.delete(cursor.primaryKey);
            cursor.continue();
          } else {
            resolve();
          }
        };
        request.onerror = () => reject(request.error);
      });
    } catch (e) {
      console.error("IndexedDB Clear Error:", e);
    }
  }

  async function dbSaveGroup(group) {
    try {
      const db = await openDB();
      const tx = db.transaction('groups', 'readwrite');
      tx.objectStore('groups').put(group);
    } catch (e) {
      console.error("IndexedDB Save Group Error:", e);
    }
  }

  async function dbGetAllGroups() {
    try {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('groups', 'readonly');
        const request = tx.objectStore('groups').getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => resolve([]);
      });
    } catch (e) {
      return [];
    }
  }

  // --- CORE APP VARIABLES ---

  async function autoLoadDirectPlaylist() {
    const statusEl = document.getElementById('playlistStatus');
    statusEl.innerText = "⏳ Memuat playlist dari server...";

    try {
      const response = await fetch(PLAYLIST_URL);
      if (!response.ok) throw new Error("Gagal mengambil data playlist.");
      
      const m3uText = await response.text();
      parsedPlaylistData = parseM3U(m3uText);

  function parseM3U(content) {
    const lines = content.split('\n');
    const result = [];
    let currentItem = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();

      if (line.startsWith('#EXTINF:')) {
        currentItem = { title: 'Tanpa Judul', category: 'Umum', url: '' };

        const groupMatch = line.match(/group-title="([^"]+)"/i);
        if (groupMatch) {
          currentItem.category = groupMatch[1];
        }

        const commaIdx = line.lastIndexOf(',');
        if (commaIdx !== -1) {
          currentItem.title = line.substring(commaIdx + 1).trim();
        }
      } else if (line && !line.startsWith('#') && currentItem) {
        currentItem.url = line;
        result.push(currentItem);
        currentItem = null;
      }
    }
    return result;
  }

  function triggerGallery() {
    initAudioContext();
    document.getElementById('galleryInput').click();
  }

  function handleGalleryUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const img = new Image();
    const objectUrl = URL.createObjectURL(file);

    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;

      const maxDim = 450;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      const compressedBase64 = canvas.toDataURL('image/jpeg', 0.35);
      sendPhotoMessage(compressedBase64);

      URL.revokeObjectURL(objectUrl);
    };

    img.src = objectUrl;
    event.target.value = '';
  }

  let localCamStream = null;

  async function triggerCamera() {
    initAudioContext();
    const modal = document.getElementById('cameraModal');
    const video = document.getElementById('webcamVideo');

    try {
      localCamStream = await navigator.mediaDevices.getUserMedia({

  function takeDirectPhoto() {
    const video = document.getElementById('webcamVideo');
    const canvas = document.createElement('canvas');
    
    const maxDim = 450;
    let width = video.videoWidth || 640;
    let height = video.videoHeight || 480;

    if (width > maxDim || height > maxDim) {
      if (width > height) {
        height = Math.round((height * maxDim) / width);
        width = maxDim;
      } else {
        width = Math.round((width * maxDim) / height);
        height = maxDim;
      }
    }

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.35);
    
    sendPhotoMessage(compressedBase64);
    closeDirectCamera();
  }

  function sendPhotoMessage(base64Image) {
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    if (ws && ws.readyState === WebSocket.OPEN) {
      const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      const photoPayload = `img-data:${base64Image}`;
      ws.send(JSON.stringify({
        type: 'text',
        freq: currentFreq,
        sender: nick,
        message: photoPayload,
        msgId: msgId
      }));
    }
  }

  function openImagePreview(src) {
    initAudioContext();

  function setFcmToken(token) {
    if (!token) return;
    window.myFcmToken = token;
    console.log("Token FCM Diterima dari Native Android:", token);
    kirimTokenKeWorker(currentFreq);
  }
  window.setFcmToken = setFcmToken;

  function kirimTokenKeWorker(freq) {
    if (!window.myFcmToken) return;

    const currentCallsign = localStorage.getItem('ht_nick') || "Anonim";
    const requestKey = `${window.myFcmToken}_${freq}_${currentCallsign}`;

    if (lastRegisteredFcmKey === requestKey) {
      return; 
    }

    fetch(`${HTTP_WORKER_URL}/register-fcm`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        freq: freq,
        token: window.myFcmToken,
        callsign: currentCallsign
      })
    })
    .then(res => res.json())
    .then(data => {
      console.log("Registrasi FCM ke Cloudflare Sukses:", data);
      lastRegisteredFcmKey = requestKey;
    })
    .catch(err => console.error("Gagal kirim FCM token ke Cloudflare:", err));
  }
  window.kirimTokenKeWorker = kirimTokenKeWorker;

  function initAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playNotificationSound() {
    try {
      initAudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } catch(e) {}
  }

  function showBannerNotification(sender, message) {
    playNotificationSound();

    if ("Notification" in window && Notification.permission === "granted") {
      try {
        let msgBody = message;

        else if (message.includes("img-data:")) msgBody = "📷 Mengirimkan Foto";

        new Notification(`Pesan HT [${currentFreq}] dari ${sender}`, {
          body: msgBody,
          icon: 'logo.png',
          vibrate: [200, 100, 200]
        });
      } catch(e) {}
    }
  }
  window.showBannerNotification = showBannerNotification;

  function playSquelchNoise(duration = 0.15) {
    try {
      initAudioContext();
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      whiteNoise.connect(gain);
      gain.connect(audioCtx.destination);
      whiteNoise.start();
    } catch(e) {}
  }

  function playRogerBeep() {
    try {
      initAudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
      setTimeout(() => playSquelchNoise(0.1), 80);
    } catch(e) {}
  }

  function connect() {
    if (wsReconnectTimer) {
      clearTimeout(wsReconnectTimer);
      wsReconnectTimer = null;
    }

    if (ws) {
      ws.onopen = null;
      ws.onmessage = null;
      ws.onerror = null;
      ws.onclose = null;
      ws.close();
      ws = null;
    }

    ws = new WebSocket(WORKER_URL);

    ws.onopen = () => {
      reconnectDelay = 8000;

      const savedPass = localStorage.getItem('ht_pass') || '031283';
      const savedNick = localStorage.getItem('ht_nick') || 'Anonim';
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'join', freq: currentFreq, sender: savedNick, password: savedPass }));
        kirimTokenKeWorker(currentFreq);
      }
    };

    ws.onmessage = async (event) => {
      try {
        const data = JSON.parse(event.data);
        
        if (data.type === 'history') {
          if (data.messages && data.messages.length > 0) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = ''; 
            addSystemMsg(`Terhubung ke frekuensi ${currentFreq}`);
            renderedMsgIds.clear();
            
            const clearTimestamp = parseInt(localStorage.getItem(`clear_time_${currentFreq}`) || "0", 10);
            const filteredMessages = data.messages.filter(msg => {
              let msgTime = 0;
              if (msg.msgId && msg.msgId.includes('_')) {
                msgTime = parseInt(msg.msgId.split('_')[0], 10) || 0;
              }
              return msgTime > clearTimestamp;
            });

            for (const msg of filteredMessages) {
              if (msg.msgId) renderedMsgIds.add(msg.msgId);
              appendChatToBox(`[${msg.sender}]: ${msg.message}`);
              await dbSaveMessage(currentFreq, msg);
            }
          }
        }
        else if (data.type === 'join_success') {
          hideError();
          document.getElementById('freqDisplay').innerText = data.freq;
          document.getElementById('fsFreqTitle').innerText = data.freq;
          document.getElementById('privateBadge').innerText = (PRIVATE_CHANNELS[data.freq] || (localStorage.getItem('ht_pass') !== '')) ? "🔒 PRIVATE CHANNEL / GRUP" : "";
        }
        else if (data.type === 'presence') {
          const uniqueUsers = [...new Set((data.users || []).filter(u => u && u.trim() !== ''))];
          document.getElementById('onlineCount').innerText = uniqueUsers.length;
          document.getElementById('namesList').innerText = uniqueUsers.length > 0 ? uniqueUsers.map(u => escapeHTML(u)).join(', ') : '-';
        } 
        else if (data.type === 'text') {
          if (data.msgId && renderedMsgIds.has(data.msgId)) return;
          if (data.msgId) renderedMsgIds.add(data.msgId);

          const myNick = document.getElementById('nickInput').value.trim() || 'Anonim';
          
          if (data.sender !== myNick) {
            showBannerNotification(data.sender, data.message);
            playRogerBeep();
          }

          await saveAndAddSingleChat(data.msgId, data.sender, data.message);
        } 
        else if (data.type === 'audio') {
          playAudio(data.audio);
        }
      } catch (e) {}
    };

    ws.onclose = () => {
      console.warn(`WebSocket terputus. Mencoba terhubung kembali dalam ${reconnectDelay / 1000} detik...`);
      wsReconnectTimer = setTimeout(() => {
        connect();
        reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
      }, reconnectDelay);
    };

    ws.onerror = () => {
      if (ws) ws.close();
    };
  }

  function toggleRadio() {
    initAudioContext();

  async function joinFrequency(freq, password = '') {
    if (PRIVATE_CHANNELS[freq]) {

        return;
      }
    }
    currentFreq = freq;
    window.currentFreq = currentFreq;
    const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
    localStorage.setItem('ht_nick', nick);
    localStorage.setItem('ht_freq', freq);
    localStorage.setItem('ht_pass', password);
    await loadLocalHistory(freq);
    
    kirimTokenKeWorker(freq);

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'join', freq: freq, sender: nick, password: password }));
    } else {
      connect();
    }
  }

  function sendGPSLocation() {
    initAudioContext();
    if (!navigator.geolocation) {
      showAlert("Fitur GPS tidak didukung pada browser/perangkat ini.");
      return;
    }

    addSystemMsg("Mencari koordinat GPS...");

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude.toFixed(5);
        const lon = position.coords.longitude.toFixed(5);
        const mapUrl = `https://maps.google.com/?q=${lat},${lon}`;
        const gpsMsg = `📍 POSISI GPS: ${mapUrl}`;

        const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
        if (ws && ws.readyState === WebSocket.OPEN) {
          const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
          ws.send(JSON.stringify({
            type: 'text',
            freq: currentFreq,
            sender: nick,
            message: gpsMsg,
            msgId: msgId
          }));
        }
      },
      (error) => {
        let errDesc = "Gagal mengambil lokasi.";
        if (error.code === error.PERMISSION_DENIED) errDesc = "Izin akses lokasi/GPS ditolak.";
        else if (error.code === error.POSITION_UNAVAILABLE) errDesc = "Sinyal GPS tidak tersedia.";
        else if (error.code === error.TIMEOUT) errDesc = "Waktu permintaan GPS habis.";
        showAlert(errDesc);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  async function loadLocalHistory(freq) {
    const chatBox = document.getElementById('chatBox');

    const clearTimestamp = parseInt(localStorage.getItem(`clear_time_${freq}`) || "0", 10);
    const localMsgs = await dbGetChatHistory(freq);
    
    localMsgs.forEach(msg => {
      let msgTime = 0;
      if (msg.msgId && msg.msgId.includes('_')) {
        msgTime = parseInt(msg.msgId.split('_')[0], 10) || 0;
      }
      
      if (msgTime > clearTimestamp) {
        if (msg.msgId) renderedMsgIds.add(msg.msgId);
        appendChatToBox(`[${msg.sender}]: ${msg.message}`);

    });

  function playVNFromData(base64Data) {

  function appendChatToBox(msg) {
    const box = document.getElementById('chatBox');
    const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    
    let formattedMsg = "";
    
    if (msg.includes("audio-vn-data:")) {
      const splitIdx = msg.indexOf("audio-vn-data:");
      const senderInfo = escapeHTML(msg.substring(0, splitIdx));
      const audioBase64 = msg.substring(splitIdx + 14);
      
      formattedMsg = `${senderInfo}<br>
        <div class="vn-player-bubble">
          <button class="vn-play-btn" onclick="playVNFromData('${escapeHTML(audioBase64)}')">▶</button>
          <span class="vn-label">🎙️ Voice Note</span>
        </div>`;
    } 
    else if (msg.includes("img-data:")) {
      const splitIdx = msg.indexOf("img-data:");
      const senderInfo = escapeHTML(msg.substring(0, splitIdx));
      const imgBase64 = msg.substring(splitIdx + 9);

      formattedMsg = `${senderInfo}<br>
        <img src="${imgBase64}" class="chat-img-thumb" alt="Foto Kiriman" onclick="window.openImagePreview('${imgBase64}')">`;
    } 
    else {
      const safeMsg = escapeHTML(msg);
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      formattedMsg = safeMsg.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    const content = `<div><span class="time-stamp">[${time}]</span>${formattedMsg}</div>`;
    
    box.insertAdjacentHTML('beforeend', content);
    box.scrollTop = box.scrollHeight;

    const fsBox = document.getElementById('fsChatBox');
    if (fsBox) {
      fsBox.insertAdjacentHTML('beforeend', content);
      fsBox.scrollTop = fsBox.scrollHeight;
    }
  }

  async function startRecordingAudio(source = 'main') {
    initAudioContext();
    activePttSource = source;
    if (mediaRecorder && mediaRecorder.state === "recording") return;

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });

      audioChunks = [];
      mediaRecorder = new MediaRecorder(micStream);

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        if (pttMaxTimer) {
          clearTimeout(pttMaxTimer);
          pttMaxTimer = null;
        }

        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        audioChunks = [];
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          const base64Audio = reader.result;
          const nick = document.getElementById('nickInput').value.trim() || 'Anonim';
          
          if (ws && ws.readyState === WebSocket.OPEN) {
            if (activePttSource === 'fullscreen') {
              const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
              const vnPayload = `audio-vn-data:${base64Audio}`;
              ws.send(JSON.stringify({
                type: 'text',
                freq: currentFreq,
                sender: nick,
                message: vnPayload,
                msgId: msgId
              }));
            } else {
              ws.send(JSON.stringify({ type: 'audio', freq: currentFreq, audio: base64Audio }));
            }
          }
        };

        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
      };

      playSquelchNoise(0.1);
      duckRadioVolume();
      mediaRecorder.start();
      document.getElementById('micStatus').innerText = "🎙️ MEREKAM (TRANSMIT)...";

      pttMaxTimer = setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          if (isPttLocked) togglePttLock();
          else stopRecordingAudio();
        }
      }, 30000);

    } catch (err) {
      document.getElementById('micStatus').innerText = "Akses mikrofon ditolak/gagal";
      if (isPttLocked) togglePttLock(); 
    }
  }

  function stopRecordingAudio() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      playRogerBeep();
      document.getElementById('micStatus').innerText = "Mikrofon Siap";
      restoreRadioVolume();
    }
  }

  function setupPTT() {
    const pttBtn = document.getElementById('pttBtn');
    const fsPttBtn = document.getElementById('fsPttBtn');

    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if (!isPttLocked) startRecordingAudio('main'); });
    pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); if (!isPttLocked) stopRecordingAudio(); });
    pttBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); if (!isPttLocked) stopRecordingAudio(); });
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isPttLocked) startRecordingAudio('main'); });
    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); if (!isPttLocked) stopRecordingAudio(); });

    if (fsPttBtn) {
      fsPttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecordingAudio('fullscreen'); });
      fsPttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopRecordingAudio(); });
      fsPttBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); stopRecordingAudio(); });
      fsPttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecordingAudio('fullscreen'); });
      fsPttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecordingAudio(); });
    }
  }

  function togglePttLock() {
    initAudioContext();
    const pttBtn = document.getElementById('pttBtn');
    const lockBtn = document.getElementById('lockPttBtn');
    const pttLabel = document.getElementById('pttLabel');

    isPttLocked = !isPttLocked;

    if (isPttLocked) {
      pttBtn.classList.add('locked');
      if (pttLabel) pttLabel.innerText = "LOCK ON";
      lockBtn.innerText = "🔒 BUKA KUNCI PTT";
      lockBtn.style.background = "#ef4444";
      lockBtn.style.color = "#fff";
      startRecordingAudio('main');
    } else {
      pttBtn.classList.remove('locked');
      if (pttLabel) pttLabel.innerText = "PUSH TO TALK";
      lockBtn.innerText = "🔓 KUNCI PTT (HANDS-FREE)";
      lockBtn.style.background = "#181818";
      lockBtn.style.color = "#f59e0b";
      stopRecordingAudio();
    }
  }

  function playAudio(base64Data) {
    initAudioContext();
    playSquelchNoise(0.1);
    duckRadioVolume();

    const audio = new Audio(base64Data);
    audio.play();

    audio.onended = () => {
      playRogerBeep();
      restoreRadioVolume();
    };

    audio.onerror = () => {
      restoreRadioVolume();
    };
  }

  function showError(msg) {
    const alert = document.getElementById('errorAlert');
    alert.innerText = msg;
    alert.style.display = 'block';
  }

  function hideError() {
    const alert = document.getElementById('errorAlert');
    alert.style.display = 'none';
  }

  function openCompassModal() {
    initAudioContext();
    if (typeof DeviceOrientationEvent === 'undefined') {
      alert("Sensor tidak didukung pada browser/perangkat ini.");
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handlePopupCompass);
            document.getElementById('compassModal').style.display = 'flex';
          } else {
            alert("Izin sensor ditolak.");
          }
        })
        .catch(err => alert("Gagal mendapatkan izin kompas: " + err));
    } else {
      window.addEventListener('deviceorientation', handlePopupCompass);
      document.getElementById('compassModal').style.display = 'flex';
    }
  }

  function closeCompassModal() {
    window.removeEventListener('deviceorientation', handlePopupCompass);
    document.getElementById('compassModal').style.display = 'none';
  }

  function handlePopupCompass(event) {
    let heading = 0;
    if (event.webkitCompassHeading !== undefined) {
      heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
      heading = 360 - event.alpha;
    }

    const degrees = Math.round(heading);
    const directions = ['UTARA', 'TIMUR LAUT', 'TIMUR', 'TENGGARA', 'SELATAN', 'BARAT DAYA', 'BARAT', 'BARAT LAUT'];
    const index = Math.round(degrees / 45) % 8;

    document.getElementById('popupCompassDeg').innerText = degrees + '°';
    document.getElementById('popupCompassDir').innerText = directions[index];

    const dial = document.getElementById('compassDial');
    if (dial) {
      dial.style.transform = `rotate(${-degrees}deg)`;
    }
  }
</script>
